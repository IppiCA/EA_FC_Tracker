<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="app-icon.png">
<title>EA FC Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B10; --panel:rgba(18,24,32,.58); --panel-2:rgba(26,34,44,.6); --line:rgba(255,255,255,.09);
  --turf:#3CFF9A; --turf-dim:#22C97A; --violet:#8B6CFF; --violet-dim:#6B4EE0; --gold:#F0C464; --red:#FF5C72; --blue:#5B8FD9;
  --ink:#F2F6F4; --ink-dim:#A6B4B9; --ink-faint:#647079;
  --radius:16px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
:root:not([data-theme="light"]){ }
:root[data-theme="light"]{
  --bg:#EEF2F1; --panel:rgba(255,255,255,.75); --panel-2:rgba(255,255,255,.55); --line:rgba(10,20,20,.1);
  --ink:#0E1A17; --ink-dim:#48605A; --ink-faint:#8CA096;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
h1,h2,h3,.num,.brand{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.01em;}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ---- ambient background (Zermatt photo, dimmed, fixed behind the whole app) ---- */
#bg-scene{position:fixed; inset:0; z-index:0; overflow:hidden}
#bg-scene img{width:100%; height:100%; object-fit:cover; object-position:center 30%; filter:saturate(.75) brightness(.34);}
#bg-scene::after{content:''; position:absolute; inset:0; background:
  radial-gradient(120% 90% at 15% 0%, rgba(60,255,154,.10), transparent 55%),
  radial-gradient(100% 80% at 100% 100%, rgba(139,108,255,.14), transparent 55%),
  linear-gradient(180deg, rgba(7,11,16,.55), rgba(7,11,16,.88) 60%, #070B10 100%);
}
:root[data-theme="light"] #bg-scene img{ filter:saturate(.55) brightness(.95); }
:root[data-theme="light"] #bg-scene::after{ background:
  radial-gradient(120% 90% at 15% 0%, rgba(34,201,122,.08), transparent 55%),
  radial-gradient(100% 80% at 100% 100%, rgba(139,108,255,.10), transparent 55%),
  linear-gradient(180deg, rgba(238,242,241,.6), rgba(238,242,241,.88) 60%, #EEF2F1 100%);
}

/* ---- layout shell ---- */
#app{display:flex; min-height:100vh; min-height:100dvh; position:relative; z-index:1; gap:14px; padding:14px;}
nav.rail{
  width:212px; flex:0 0 212px; background:var(--panel);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line); border-radius:20px;
  padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:4px;
  position:sticky; top:14px; height:calc(100vh - 28px); height:calc(100dvh - 28px); overflow-y:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.rail-brand{padding:6px 8px 18px; display:flex; align-items:center; gap:10px}
.rail-brand .crest{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:0 0 auto; box-shadow:0 0 18px rgba(60,255,154,.35)}
.rail-brand .brand{font-size:19px; line-height:1.05; letter-spacing:.02em}
.rail-brand .brand small{display:block;font-family:'IBM Plex Sans';font-weight:500;font-size:11px;color:var(--ink-faint);letter-spacing:.04em}
.navbtn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:11px 14px; border-radius:12px; border:none; background:transparent; color:var(--ink-dim);
  font-family:'Rajdhani',sans-serif; font-size:15.5px; font-weight:600; letter-spacing:.02em;
}
.navbtn .ic{width:18px;text-align:center;opacity:.85}
.navbtn:hover{background:var(--panel-2); color:var(--ink)}
.navbtn.active{background:linear-gradient(90deg, var(--turf), var(--violet)); color:#081008; font-weight:700; box-shadow:0 4px 16px rgba(60,255,154,.25)}
.rail-foot{padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-faint); display:flex; justify-content:space-between; align-items:center}
.themebtn{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;padding:5px 8px;font-size:11px}

main{flex:1; min-width:0; padding:0; max-width:1180px; position:relative; z-index:1}
.pagehead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
.pagehead h1{font-size:32px; margin:0; letter-spacing:.01em}
.pagehead .sub{color:var(--ink-dim); font-size:13.5px; margin-top:2px}

/* ---- mobile bottom nav ---- */
nav.tabbar{display:none}
@media (max-width: 860px){
  nav.rail{display:none}
  #app{flex-direction:column; padding:12px; gap:0}
  main{padding:0 2px 90px; max-width:none}
  nav.tabbar{
    display:flex; position:fixed; bottom:10px; left:10px; right:10px; z-index:50;
    background:var(--panel); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line); border-radius:18px;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
    box-shadow:0 12px 30px rgba(0,0,0,.4);
  }
  nav.tabbar button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none;border:none;color:var(--ink-faint);font-size:10.5px;padding:4px 0;
    font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:.02em;
  }
  nav.tabbar button .ic{font-size:18px}
  nav.tabbar button.active{color:var(--turf)}
}

/* ---- shared bits ---- */
.card{background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:var(--radius); padding:18px; position:relative; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.25)}
.card::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--turf),var(--violet)); opacity:.9}
.card.accent-gold::before{background:linear-gradient(90deg,var(--gold),#fff3cf)}
.card.accent-red::before{background:linear-gradient(90deg,var(--red),#ff9aa8)}
.card.accent-plain::before{display:none}
.grid{display:grid; gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){ .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)} }
.stat{padding:16px}
.stat .num{font-size:34px; line-height:1; color:var(--turf)}
.stat .num.gold{color:var(--gold)} .stat .num.red{color:var(--red)}
.stat .lbl{font-size:12px; color:var(--ink-dim); margin-top:6px}
.section-title{font-size:12px; text-transform:none; letter-spacing:.02em; color:var(--ink-faint); margin:26px 0 10px; font-weight:600}
.section-title:first-child{margin-top:0}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; color:var(--ink-faint); font-weight:600; font-size:11.5px; padding:7px 10px; border-bottom:1px solid var(--line)}
td{padding:8px 10px; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.right{text-align:right}
.center{text-align:center}

.btn{
  display:inline-flex; align-items:center; gap:7px; background:linear-gradient(90deg,var(--turf),var(--violet)); color:#081008;
  border:none; padding:10px 16px; border-radius:12px; font-weight:700; font-size:14px;
  font-family:'Rajdhani',sans-serif; letter-spacing:.02em;
  box-shadow:0 6px 18px rgba(60,255,154,.2);
}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); box-shadow:none}
.btn.gold{background:linear-gradient(90deg,var(--gold),#fff3cf); box-shadow:0 6px 18px rgba(240,196,100,.2)}
.btn.small{padding:6px 11px; font-size:13px}
.btn:disabled{opacity:.5}

input[type=text],input[type=number],select,textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
  border-radius:10px; padding:9px 12px; font-size:14px;
}
label{font-size:12px; color:var(--ink-dim); display:block; margin-bottom:5px}
.field{margin-bottom:12px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1; min-width:120px}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; font-family:'Rajdhani',sans-serif; letter-spacing:.03em}
.pill.win{background:rgba(60,255,154,.16); color:var(--turf)}
.pill.draw{background:rgba(240,196,100,.16); color:var(--gold)}
.pill.loss{background:rgba(255,92,114,.16); color:var(--red)}

.shield{
  position:relative; width:46px; height:52px; flex:0 0 auto;
  background:linear-gradient(160deg, var(--panel-2), rgba(0,0,0,.3));
  border:1px solid var(--line); clip-path:polygon(50% 0%,100% 18%,100% 70%,50% 100%,0% 70%,0% 18%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.04);
}
.shield .n{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--gold)}
.form-ticker{display:flex; gap:4px}
.form-ticker .f{width:20px; height:20px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; font-family:'Rajdhani',sans-serif; color:#081008}
.form-ticker .f.win{background:var(--turf)}
.form-ticker .f.draw{background:var(--gold)}
.form-ticker .f.loss{background:var(--red); color:#2b0006}
.form-ticker .f.empty{background:var(--panel-2); color:transparent}

.vs-bar{display:flex; align-items:center; gap:10px; margin:5px 0}
.vs-bar .track{flex:1; height:7px; background:var(--panel-2); border-radius:99px; overflow:hidden; display:flex}
.vs-bar .fill-a{background:linear-gradient(90deg,var(--turf),var(--violet)); height:100%}
.vs-bar .fill-b{background:var(--ink-faint); height:100%}
.vs-bar .val{font-size:12.5px; width:36px; color:var(--ink-dim); font-weight:600}
.vs-bar .val.right{text-align:right}
.vs-label{font-size:11px; color:var(--ink-faint); text-align:center; margin-top:1px}

.modal-bg{position:fixed; inset:0; background:rgba(2,4,6,.7); backdrop-filter:blur(4px); display:flex; align-items:flex-end; justify-content:center; z-index:100}
@media (min-width:760px){ .modal-bg{align-items:center} }
.modal{background:var(--panel); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%; max-width:640px; max-height:92vh; overflow-y:auto; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:0 20px 60px rgba(0,0,0,.5)}
@media (min-width:760px){ .modal{border-radius:20px} }
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.modal-head h3{margin:0; font-size:22px}
.xbtn{background:none;border:none;color:var(--ink-dim);font-size:20px;padding:4px 8px}

.empty{padding:40px 20px; text-align:center; color:var(--ink-faint)}
.badge-champ{color:var(--gold); font-size:13px}
.tag{font-size:11px; background:var(--panel-2); border:1px solid var(--line); padding:3px 9px; border-radius:8px; color:var(--ink-dim)}
.hint{font-size:12px; color:var(--ink-faint); margin-top:4px}
.scanbox{border:1.5px dashed var(--line); border-radius:14px; padding:16px; text-align:center; color:var(--ink-dim); font-size:13px}
.scanbox.active{border-color:var(--turf); color:var(--turf)}
/* ---- slim PLAYERS-screen scan box (top of Log Match) ---- */
.scanbox.meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px; text-align:left; font-size:13px}
.scanbox.meta .meta-spacer{flex:1}
/* ---- gamertag row: tag input + Console/PC + country droppers, all the same height ---- */
.tagrow{display:flex; gap:6px; align-items:stretch}
.tagrow > *{height:40px}
.tagrow .tg-in{flex:1; min-width:84px}
.ddrop{position:relative; flex:0 0 auto; width:112px}
.ddrop.cty{width:124px}
.ddrop-btn{width:100%; height:40px; display:flex; align-items:center; gap:7px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:0 10px; font-size:13.5px; color:var(--ink); text-align:left; font-family:inherit; white-space:nowrap; overflow:hidden}
.ddrop-btn .chev{margin-left:auto; color:var(--ink-faint); font-size:11px; flex:0 0 auto}
.ddrop-btn svg{width:16px; height:16px; flex:0 0 auto}
.ddrop-btn img{width:22px; border-radius:4px; flex:0 0 auto}
.ddrop-btn .ph{color:var(--ink-faint)}
.ddrop-btn .nm{overflow:hidden; text-overflow:ellipsis}
.ddrop-pop{display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:60; background:rgba(16,23,32,.98);
  border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 18px 44px rgba(0,0,0,.55)}
.ddrop.pop-open .ddrop-pop{display:block}
.ddrop.pop-open .ddrop-btn{border-color:var(--turf)}
.ddrop-opt{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:13.5px; cursor:pointer; white-space:nowrap}
.ddrop-opt:hover{background:var(--panel-2)}
.ddrop-opt.sel{color:var(--turf); background:rgba(60,255,154,.08)}
.ddrop-opt svg{width:16px; height:16px; flex:0 0 auto}
.ddrop-opt img{width:22px; border-radius:4px; flex:0 0 auto}
.ddrop-opt .chk{margin-left:auto; font-size:12px}
.ddrop.cty .ddrop-pop{width:200px}
.ddrop-search{width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12.5px; color:var(--ink); margin-bottom:5px; font-family:inherit}
.ddrop-list{max-height:230px; overflow-y:auto}
.ocr-row{display:grid; grid-template-columns:64px minmax(0,1fr) 54px 42px 42px 30px 24px 28px; gap:6px; align-items:center; margin-bottom:6px}
.ocr-row input{padding:6px 7px; font-size:13px}
.ocr-row .del{background:none;border:none;color:var(--red);font-size:16px}
.ocr-row .ren{background:none;border:none;color:var(--gold);font-size:14px;padding:2px 4px}
.ocr-row .ren:hover{color:var(--ink)}
.ocr-row input[type=checkbox]{width:16px;height:16px;margin:0;justify-self:center;accent-color:var(--turf)}
/* Column tints (light, so the numbers keep their contrast) + stronger fill when a
   cell holds a real value — played players light up, ones who sat out stay plain. */
.ocr-row input[data-f=rating]{background:rgba(60,255,154,.08); border-color:rgba(60,255,154,.30)}
.ocr-row input[data-f=goals]{background:rgba(45,212,191,.09); border-color:rgba(45,212,191,.32)}
.ocr-row input[data-f=assists]{background:rgba(139,108,255,.10); border-color:rgba(139,108,255,.34)}
.ocr-row input.hasval{font-weight:600}
.ocr-row input[data-f=rating].hasval{background:rgba(60,255,154,.22)}
.ocr-row input[data-f=goals].hasval{background:rgba(45,212,191,.24)}
.ocr-row input[data-f=assists].hasval{background:rgba(139,108,255,.26)}
.ocr-head{display:grid; grid-template-columns:64px minmax(0,1fr) 54px 42px 42px 30px 24px 28px; gap:6px; font-size:10.5px; color:var(--ink-faint); margin-bottom:4px; padding:0 2px}
.statline{display:grid; grid-template-columns:60px 1fr 60px; gap:8px; align-items:center; margin-bottom:6px; font-size:13px}
.statline input{text-align:center}
.statline .lbl{color:var(--ink-dim); font-size:12.5px; text-align:center}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line); padding:10px 18px; border-radius:12px; font-size:13px; z-index:200; box-shadow:0 12px 30px rgba(0,0,0,.4)}
.progress{height:5px; background:var(--panel-2); border-radius:99px; overflow:hidden; margin-top:8px}
.progress > div{height:100%; background:linear-gradient(90deg,var(--turf),var(--violet)); transition:width .2s}
::placeholder{color:var(--ink-faint)}
.link-btn{background:none;border:none;color:var(--turf);font-size:12.5px;font-weight:600;padding:0}
.subtle{color:var(--ink-faint); font-size:12.5px}
.login-wrap{position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; background:#f5ead8; font-family:'Figtree',system-ui,sans-serif;}
.login-wrap .zc-bg{position:absolute; inset:0;}
.login-wrap .zc-bg img{width:100%; height:100%; object-fit:cover; object-position:center; display:block;}
.login-wrap .zc-snow{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.login-wrap .zc-snow .flake{position:absolute; top:-20px; border-radius:50%; background:#fff; animation-name:zc-fall; animation-timing-function:linear; animation-iteration-count:infinite;}
@keyframes zc-fall{ from{ transform:translate(0,-20px); } to{ transform:translate(30px,105vh); } }
.login-card{
  position:absolute; left:clamp(16px,2vw,48px); top:clamp(16px,6vh,120px);
  width:clamp(240px,25vw,340px); max-width:calc(100% - 32px); box-sizing:border-box;
  padding:26.4px; display:flex; flex-direction:column; gap:14px;
  background:#ebddc5; border-radius:28px; box-shadow:0 12px 32px rgba(46,43,37,.22);
  color:#201e1d;
}
.login-card .zc-tag{ align-self:flex-start; font-size:11px; letter-spacing:.02em; padding:3px 10px; border-radius:12px; background:#f0fae1; color:#3d472b; }
.login-card h1{ font-family:'Caprasimo',serif; font-weight:400; font-size:40px; line-height:1.05; margin:8px 0 0; color:#201e1d; }
.login-card .zc-sub{ font-family:'Figtree',sans-serif; color:#645c50; margin:0 0 6px; font-size:14px; }
.zc-google-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:#c67139; color:#fff8f0; border:none; border-radius:999px;
  padding:12px 18px; font-family:'Figtree',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
}
.zc-google-btn:hover{ background:#b2622d; }
.zc-google-btn:active{ background:#8c491a; }
.zc-google-btn:disabled{ opacity:.45; cursor:not-allowed; }
.zc-google-btn:focus-visible{ outline:2px solid #c67139; outline-offset:2px; }
.zc-error{ font-family:'Figtree',sans-serif; color:#8c491a; font-size:12.5px; min-height:16px; text-align:center; }
@media (max-width:700px){
  .login-card{ left:16px; right:16px; top:auto; bottom:16px; width:auto; max-width:none; }
}
@media (prefers-reduced-motion: reduce){
  .login-wrap .zc-snow{ display:none; }
}
</style>
</head>
<body>
<div id="bg-scene" aria-hidden="true">
  <picture>
    <source srcset="zermatt-scene.webp" type="image/webp">
    <img src="zermatt-scene.jpg" alt="">
  </picture>
</div>
<div id="login-screen" class="login-wrap">
  <div class="zc-bg">
    <picture>
      <source srcset="zermatt-scene.webp" type="image/webp">
      <img src="zermatt-scene.jpg" alt="Two friends playing EA FC on a snowy mountainside at sunset, the Matterhorn behind them">
    </picture>
  </div>
  <div class="zc-snow" id="zc-snow" aria-hidden="true"></div>
  <div class="login-card">
    <span class="zc-tag">Co-op Season · Zermatt</span>
    <h1>FC Tracker</h1>
    <p class="zc-sub">Sign in to log tonight's matches.</p>
    <button type="button" class="zc-google-btn" id="google-signin-btn">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ======================================================================
   PASTE YOUR FIREBASE CONFIG HERE — from Firebase Console → Project
   settings → Your apps → the </> web app → the firebaseConfig object.
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCVOLlCNadBDYibxnyw2XmZZt3WwJ0rdBU",
  authDomain: "ea-fc-tracker.firebaseapp.com",
  projectId: "ea-fc-tracker",
  storageBucket: "ea-fc-tracker.firebasestorage.app",
  messagingSenderId: "934389803225",
  appId: "1:934389803225:web:7259c17a9e30235b4576c8"
};
/* ====================================================================== */

/* ============================= STATE ============================= */
let db = null;
let players = [];   // {id, name}
let teams = [];     // {id, name, playerIds[]} — team sheets, managed in Settings
let seasons = [];   // {id, number, gameVersion, team, teamId?, squadIds[], champion, perfectSeason, createdAt}
let seedingTeams = false;
let games = [];      // {id, seasonId, gameNumber, opponentTeam, opponentGamertags[2], opponentPlatforms[2], opponentCountries[2], homeAway, scoreFor, scoreAgainst,
                      //  rageQuit ('none'|'us'|'them'), disconnect(bool), motmPlayerId, teamStats:{for:{},against:{}},
                      //  playerStats:[{playerId,position,rating,goals,assists}], createdAt}
let currentTab = 'dashboard';

const STAT_LABELS = ['Possession %','Shots','Expected Goals','Passes Attempted','Pass Accuracy %','Tackles','Tackles Won','Interceptions','Saves','Fouls Committed','Offsides','Corners','Free Kicks','Penalty Kicks','Yellow Cards','Red Cards','Def Line Breaks Through','Def Line Breaks Around','Def Line Breaks Over','Def Line Breaks Attempted','Dribble Success Rate','Shot Accuracy','Ball Recovery Time (Seconds)'];
const STAT_LABEL_SYNONYMS = {
  'passes':'Passes Attempted',
  'pass accuracy':'Pass Accuracy %',
  'shot accuracy %':'Shot Accuracy',
  'ball recovery time':'Ball Recovery Time (Seconds)',
  'ball recovery time (s)':'Ball Recovery Time (Seconds)',
  'xg':'Expected Goals'
};
function canonicalStatLabel(label){
  const norm = String(label).trim().toLowerCase().replace(/\s*%\s*$/,'').replace(/\s+/g,' ');
  const exact = STAT_LABELS.find(l=> l.toLowerCase()===String(label).trim().toLowerCase());
  if(exact) return exact;
  if(STAT_LABEL_SYNONYMS[norm]) return STAT_LABEL_SYNONYMS[norm];
  const fuzzy = STAT_LABELS.find(l=>{
    const ln = l.toLowerCase().replace(/\s*%\s*$/,'').replace(/\s*\(.*\)\s*/,'').trim();
    return ln===norm || ln.startsWith(norm) || norm.startsWith(ln);
  });
  return fuzzy || label;
}

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ============================= DB WIRING (Firebase Firestore) ============================= */
try{
  firebase.initializeApp(firebaseConfig);
}catch(e){
  console.error('Firebase init failed', e);
}

function initDb(){
  try{
    db = firebase.firestore();
  }catch(e){
    console.error('Firestore init failed', e);
    document.getElementById('syncstate').textContent = 'config error — check firebaseConfig';
    render();
    return;
  }
  const col = (name, arr, sortFn, after) => {
    db.collection(name).onSnapshot((snap)=>{
      arr.length = 0;
      snap.forEach(doc=>{ const data = doc.data(); if(data) arr.push({id:doc.id, ...data}); });
      if(sortFn) arr.sort(sortFn);
      document.getElementById('syncstate') && (document.getElementById('syncstate').textContent = 'synced');
      render();
      if(after) after();
    }, (err)=>{
      console.error(name, 'sync error', err);
      if(err.code === 'permission-denied'){
        // All four collection listeners can raise this; show the message once,
        // with the account's email captured BEFORE we sign out.
        if(!accessDeniedShown){
          accessDeniedShown = true;
          const u = (firebase.auth && firebase.auth().currentUser) || currentUser;
          const email = u && u.email ? ` (${u.email})` : '';
          const el = document.getElementById('login-error');
          if(el) el.textContent = `Access was denied for this Google account${email}. Either the account isn't on the allowed list (pick the right one via the account picture in the top-left of the Google window), or the Firestore rules don't cover a data table this version of the app uses — in that case update the rules in Firebase Console → Firestore → Rules, then sign in again.`;
          firebase.auth().signOut();
        }
        return;
      }
      document.getElementById('syncstate') && (document.getElementById('syncstate').textContent = 'sync error — check Firestore rules');
    });
  };
  col('players', players, (a,b)=> a.name.localeCompare(b.name));
  col('teams', teams, (a,b)=> a.name.localeCompare(b.name), maybeSeedTeams);
  col('seasons', seasons, (a,b)=> (b.number||0)-(a.number||0), maybeSeedTeams);
  col('games', games, (a,b)=> (b.createdAt||0)-(a.createdAt||0));
}

async function dbAdd(collection, data){
  const ref = await db.collection(collection).add(data);
  const arr = collection==='players'?players:collection==='seasons'?seasons:collection==='teams'?teams:games;
  arr.push({id: ref.id, ...data}); // optimistic — the live snapshot reconciles right after
  return ref.id;
}
async function dbSet(collection, id, data){
  await db.collection(collection).doc(id).set(data);
}
async function dbDelete(collection, id){
  await db.collection(collection).doc(id).delete();
}

/* ============================= DERIVED / COMPUTE ============================= */
function playerName(id){ const p = players.find(p=>p.id===id); return p ? p.name : '—'; }
/* Rename a player everywhere (scanner list, history, MOTM). Used by the ✎ buttons. */
async function renamePlayer(id){
  const p = players.find(x=>x.id===id); if(!p) return;
  const name = (prompt(`Rename "${p.name}" — applies everywhere:`, p.name)||'').trim();
  if(!name || name.toLowerCase()===p.name.toLowerCase()) return;
  await dbSet('players', id, {name});
  const dupe = players.find(x=>x.id!==id && normalizeName(x.name)===normalizeName(name));
  toast(dupe ? `Renamed — but "${dupe.name}" already exists; delete the one you don't need below` : 'Player renamed everywhere');
}
function normalizeName(n){ return n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^[a-z]\.\s*/,'').trim(); }
async function resolveOrCreatePlayer(rawName){
  const name = rawName.trim();
  const norm = normalizeName(name);
  // OCR frequently confuses l/I ("A.lsak" vs "A.Isak") — fold them together for comparison only
  const fold = s => s.replace(/\s+/g,'').replace(/l/g,'i');
  const pnorm = p => normalizeName(p.name);
  const existing = players.find(p=>{
    const pn = p.name.toLowerCase();
    return pn===name.toLowerCase() || pnorm(p)===norm || pn.endsWith(norm) || norm.endsWith(pnorm(p))
      || pnorm(p).replace(/\s+/g,'')===norm.replace(/\s+/g,'') // OCR may drop/double spaces
      || fold(pnorm(p))===fold(norm);
  });
  if(existing) return existing.id;
  // OCR occasionally mangles a name beyond l/I folding (e.g. "Muñoz" → "Mufioz").
  // If one player is clearly the closest (edit distance ≤ 2 and closer than every
  // other player), treat it as the same person instead of creating a duplicate.
  const lev=(a,b)=>{ const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
    let prev=Array.from({length:n+1},(_,i)=>i);
    for(let i=1;i<=m;i++){ const cur=[i];
      for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      prev=cur; }
    return prev[n]; };
  const nn = norm.replace(/\s+/g,'');
  const cand = [];
  for(const p of players){
    const pn = pnorm(p).replace(/\s+/g,'');
    if(pn.length<4 || nn.length<4) continue;
    cand.push({p, d: Math.min(lev(pn,nn), lev(fold(pn),fold(nn)))});
  }
  cand.sort((a,b)=>a.d-b.d);
  if(cand.length && cand[0].d<=2 && (cand.length<2 || cand[1].d>cand[0].d)) return cand[0].p.id;
  const id = await dbAdd('players', {name});
  // A player the scanner met for the first time joins the active team's sheet automatically
  try{
    const s = (typeof logDraft!=='undefined' && logDraft && logDraft.seasonId) ? seasonById(logDraft.seasonId) : seasons[0];
    const t = s && s.teamId ? teamById(s.teamId) : null;
    if(t && !(t.playerIds||[]).includes(id)){
      await dbSet('teams', t.id, {...stripId(t), playerIds:[...(t.playerIds||[]), id]});
    }
  }catch(e){}
  return id;
}
function seasonById(id){ return seasons.find(s=>s.id===id); }
function teamById(id){ return teams.find(t=>t.id===id); }
/* A season may span multiple teams (mid-season switch): teamIds is the ordered list
   (first = original team); teamId/team are the legacy single-team fields. */
function seasonTeams(s){
  if(!s) return [];
  const ids = (s.teamIds && s.teamIds.length) ? s.teamIds : (s.teamId ? [s.teamId] : []);
  const list = [];
  ids.forEach(id=>{ const t = teamById(id); if(t && !list.some(x=>x.id===t.id)) list.push(t); });
  if(!list.length && s.team) list.push({id:'', name:s.team, playerIds:(s.squadIds||[])});
  return list;
}
function seasonTeamName(s){
  const names = seasonTeams(s).map(t=>t.name);
  return names.length ? names.join(' / ') : (s && s.team) || '';
}
function seasonPrimaryTeamId(s){ const t = seasonTeams(s)[0]; return (t && t.id) ? t.id : ''; }
function squadForSeason(s){ const t = seasonTeams(s)[0]; return t ? (t.playerIds||[]) : (s ? (s.squadIds||[]) : []); }
/* A player counts for exactly ONE team: the add-player dropdowns only offer players
   that are not on any team sheet (or legacy season squad). */
function freePlayers(){
  const taken = new Set();
  teams.forEach(t=>(t.playerIds||[]).forEach(id=>taken.add(id)));
  seasons.forEach(s=>{ if(!s.teamId) (s.squadIds||[]).forEach(id=>taken.add(id)); });
  return players.filter(p=>!taken.has(p.id));
}
function gamesFor(seasonId){ return games.filter(g=>g.seasonId===seasonId); }

function outcome(g){
  if(g.scoreFor>g.scoreAgainst) return 'win';
  if(g.scoreFor<g.scoreAgainst) return 'loss';
  return 'draw';
}

function seasonRecord(seasonId){
  const gs = gamesFor(seasonId);
  let w=0,d=0,l=0,gf=0,ga=0,rq=0,dc=0;
  gs.forEach(g=>{
    const o = outcome(g);
    if(o==='win')w++; else if(o==='draw')d++; else l++;
    gf+=Number(g.scoreFor||0); ga+=Number(g.scoreAgainst||0);
    if(g.rageQuit==='them') rq++;
    if(g.disconnect) dc++;
  });
  return {games:gs.length, w,d,l, gf,ga, points: w*3+d, rq, dc};
}

function careerTotals(){
  let gf=0,ga=0,w=0,d=0,l=0,rq=0,dc=0;
  games.forEach(g=>{
    const o = outcome(g);
    if(o==='win')w++; else if(o==='draw')d++; else l++;
    gf+=Number(g.scoreFor||0); ga+=Number(g.scoreAgainst||0);
    if(g.rageQuit==='them') rq++;
    if(g.disconnect) dc++;
  });
  return {games:games.length, w,d,l, gf,ga, rq, dc};
}

function playerCareer(playerId, seasonId){
  let goals=0, assists=0, motm=0, apps=0, ratingSum=0, ratingN=0;
  games.forEach(g=>{
    if(seasonId && g.seasonId!==seasonId) return;
    const ps = (g.playerStats||[]).find(p=>p.playerId===playerId);
    if(!ps) return;
    apps++;
    goals += Number(ps.goals||0); assists += Number(ps.assists||0);
    if(g.motmPlayerId===playerId) motm++;
    if(ps.rating!=null && ps.rating!=='' ){ ratingSum += Number(ps.rating); ratingN++; }
  });
  return {goals, assists, points: goals+assists, motm, apps, avgRating: ratingN? (ratingSum/ratingN) : null};
}

function leaderboard(seasonId){
  return players.map(p=>({player:p, ...playerCareer(p.id, seasonId)}))
    .filter(r=>r.apps>0)
    .sort((a,b)=> b.points-a.points || b.goals-a.goals);
}

function bestWorstSeasons(filterTeam){
  const list = seasons.filter(s=> !filterTeam || seasonTeamName(s)===filterTeam).map(s=>{
    const r = seasonRecord(s.id);
    return {season:s, ...r, gd: r.gf-r.ga};
  }).filter(x=>x.games>0);
  if(!list.length) return {best:null, worst:null};
  const best = [...list].sort((a,b)=> b.points-a.points || b.gd-a.gd)[0];
  const worst = [...list].sort((a,b)=> a.points-b.points || a.gd-b.gd)[0];
  return {best, worst};
}

/* ============================= RENDER SHELL ============================= */
function setTab(t){ currentTab = t; render(); }
document.addEventListener('click', (e)=>{
  const b = e.target.closest('[data-tab]');
  if(b){ setTab(b.dataset.tab); }
});
document.getElementById('themetoggle').addEventListener('click', ()=>{
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme');
  r.setAttribute('data-theme', cur==='light' ? 'dark' : 'light');
});

function render(){
  document.querySelectorAll('.navbtn, nav.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===currentTab);
  });
  const main = document.getElementById('main');
  if(currentTab==='dashboard') main.innerHTML = renderDashboard();
  else if(currentTab==='log') main.innerHTML = renderLog();
  else if(currentTab==='squad') main.innerHTML = renderSquad();
  else if(currentTab==='settings') main.innerHTML = renderSettings();
  else if(currentTab==='history') main.innerHTML = renderHistory();
  wireTabHandlers();
}

function recentForm(seasonId, n){
  const gs = (seasonId ? gamesFor(seasonId) : games).slice(0, n).reverse();
  const pad = Math.max(0, n - gs.length);
  return Array(pad).fill('empty').concat(gs.map(outcome));
}
function formTickerHtml(seasonId, n){
  const form = recentForm(seasonId, n||10);
  return `<div class="form-ticker">${form.map(o=>`<div class="f ${o}">${o==='win'?'W':o==='draw'?'D':o==='loss'?'L':''}</div>`).join('')}</div>`;
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const ct = careerTotals();
  const {best, worst} = bestWorstSeasons();
  const lb = leaderboard().slice(0,8);
  const activeSeason = seasons[0];
  const winPct = ct.games ? Math.round(ct.w/ct.games*100) : 0;

  return `
  <div class="pagehead"><div><h1>Dashboard</h1><div class="sub">Career overview across every season logged</div></div>${ct.games?formTickerHtml(null,10):''}</div>

  <div class="grid g4">
    <div class="card stat accent-plain"><div class="num">${ct.games}</div><div class="lbl">Games played</div></div>
    <div class="card stat accent-plain"><div class="num">${winPct}%</div><div class="lbl">Win rate · ${ct.w}W ${ct.d}D ${ct.l}L</div></div>
    <div class="card stat accent-gold"><div class="num gold">${ct.gf}</div><div class="lbl">Goals scored · ${ct.games? (ct.gf/ct.games).toFixed(2):'0.00'} / game</div></div>
    <div class="card stat accent-red"><div class="num red">${ct.ga}</div><div class="lbl">Goals conceded · ${ct.rq} rage quits by them</div></div>
  </div>

  <div class="section-title">Best & worst season overall</div>
  <div class="grid g2">
    ${seasonSummaryCard(best, 'Best season', 'turf')}
    ${seasonSummaryCard(worst, 'Worst season', 'red')}
  </div>

  ${activeSeason ? `
  <div class="section-title" style="display:flex;align-items:center;gap:10px">
    <div class="shield"><div class="n">${activeSeason.number}</div></div>
    <span>Current season · ${esc(seasonTeamName(activeSeason))} <span class="tag">${esc(activeSeason.gameVersion||'')}</span></span>
  </div>
  ${seasonPanel(activeSeason)}
  ` : ''}

  <div class="section-title">All-time leaderboard <span class="subtle">(goals + assists)</span></div>
  <div class="card tablewrap">
    ${lb.length ? `
    <table>
      <tr><th>Player</th><th class="right">Apps</th><th class="right">Goals</th><th class="right">Assists</th><th class="right">Pts</th><th class="right">MOTM</th><th class="right">Avg rating</th></tr>
      ${lb.map(r=>`<tr>
        <td>${esc(r.player.name)}</td>
        <td class="right">${r.apps}</td>
        <td class="right">${r.goals}</td>
        <td class="right">${r.assists}</td>
        <td class="right" style="color:var(--turf);font-weight:700">${r.points}</td>
        <td class="right">${r.motm}</td>
        <td class="right">${r.avgRating!=null? r.avgRating.toFixed(1) : '—'}</td>
      </tr>`).join('')}
    </table>` : `<div class="empty">No games logged yet — head to <b>Log Match</b> to add your first one.</div>`}
  </div>
  `;
}

function seasonSummaryCard(entry, title, color){
  if(!entry) return `<div class="card accent-plain"><div class="section-title" style="margin-top:0">${title}</div><div class="empty">Not enough data yet</div></div>`;
  const s = entry.season;
  return `<div class="card ${color==='red'?'accent-red':''}">
    <div class="section-title" style="margin-top:0">${title}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="shield" style="width:38px;height:44px"><div class="n" style="font-size:16px">${s.number}</div></div>
        <div class="num" style="font-size:20px">${esc(seasonTeamName(s))}</div>
      </div>
      <div class="num" style="font-size:26px;color:var(--${color})">${entry.points} pts</div>
    </div>
    <div class="subtle" style="margin-top:6px">${entry.w}W ${entry.d}D ${entry.l}L &nbsp;·&nbsp; ${entry.gf}–${entry.ga} goals &nbsp;·&nbsp; GD ${entry.gd>=0?'+':''}${entry.gd}</div>
    ${s.champion? `<div class="badge-champ" style="margin-top:6px">🏆 Champions</div>`:''}
  </div>`;
}

function seasonPanel(s){
  const r = seasonRecord(s.id);
  const lb = leaderboard(s.id).slice(0,5);
  return `<div class="card">
    <div style="display:flex; justify-content:flex-end; margin-bottom:12px">${formTickerHtml(s.id,10)}</div>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat" style="padding:0"><div class="num" style="font-size:24px">${r.games}</div><div class="lbl">Games</div></div>
      <div class="stat" style="padding:0"><div class="num" style="font-size:24px">${r.points}</div><div class="lbl">Points</div></div>
      <div class="stat" style="padding:0"><div class="num gold" style="font-size:24px">${r.gf}</div><div class="lbl">Scored</div></div>
      <div class="stat" style="padding:0"><div class="num red" style="font-size:24px">${r.ga}</div><div class="lbl">Conceded</div></div>
    </div>
    <div class="tablewrap">
    <table><tr><th>Player</th><th class="right">Goals</th><th class="right">Assists</th><th class="right">Pts</th><th class="right">Avg rating</th></tr>
    ${lb.map(row=>`<tr><td>${esc(row.player.name)}</td><td class="right">${row.goals}</td><td class="right">${row.assists}</td><td class="right" style="color:var(--turf);font-weight:700">${row.points}</td><td class="right">${row.avgRating!=null?row.avgRating.toFixed(1):'—'}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">No games in this season yet</td></tr>`}
    </table>
    </div>
  </div>`;
}

/* ============================= LOG MATCH ============================= */
let logDraft = null; // in-progress match object while filling the form
let editingGameId = null; // set while editing an already-logged match

function freshDraft(){
  const s = seasons[0];
  return {
    seasonId: s ? s.id : '',
    teamId: s ? seasonPrimaryTeamId(s) : '',
    opponentTeam:'', opponentGamertags:['',''], opponentPlatforms:['',''], opponentCountries:['',''], homeAway:'home',
    scoreFor:0, scoreAgainst:0, rageQuit:'none', disconnect:false, motmPlayerId:'',
    playerStats: s ? squadForSeason(s).map(pid=>({playerId:pid, position:'', rating:'', goals:0, assists:0})) : [],
    teamStats: {for:{}, against:{}}
  };
}

function gameToDraft(g){
  return {
    seasonId: g.seasonId,
    teamId: g.teamId || seasonPrimaryTeamId(seasonById(g.seasonId)),
    opponentTeam: g.opponentTeam||'',
    opponentGamertags: g.opponentGamertags||['',''],
    opponentPlatforms: (Array.isArray(g.opponentPlatforms)&&g.opponentPlatforms.length===2)?g.opponentPlatforms:['',''],
    opponentCountries: (Array.isArray(g.opponentCountries)&&g.opponentCountries.length===2)?g.opponentCountries:['',''],
    homeAway: g.homeAway||'home',
    scoreFor: g.scoreFor||0,
    scoreAgainst: g.scoreAgainst||0,
    rageQuit: g.rageQuit||'none',
    disconnect: !!g.disconnect,
    motmPlayerId: g.motmPlayerId||'',
    playerStats: (g.playerStats||[]).map(p=>({playerId:p.playerId, position:p.position||'', rating:p.rating||'', goals:p.goals||0, assists:p.assists||0})),
    teamStats: JSON.parse(JSON.stringify(g.teamStats||{for:{}, against:{}}))
  };
}

function playerStatRow(ps, i){
  return `<div class="ocr-row" data-idx="${i}">
    <input type="text" data-f="position" value="${esc(ps.position||'')}" placeholder="POS">
    <select data-f="playerId">${players.map(p=>`<option value="${p.id}" ${p.id===ps.playerId?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <input type="text" data-f="rating" value="${esc(ps.rating)}" placeholder="N/A">
    <input type="number" data-f="goals" value="${ps.goals||0}">
    <input type="number" data-f="assists" value="${ps.assists||0}">
    <input type="checkbox" data-f="motm" title="Man of the Match" ${logDraft.motmPlayerId===ps.playerId?'checked':''}>
    <button class="ren" data-rename="${i}" title="Rename this player everywhere">✎</button>
    <button class="del" data-remove="${i}" title="Remove this row">×</button>
  </div>`;
}
/* Their gamertag + Console/PC pick + country pick — all controls the same height. */
function gamertagField(i){
  const idx = i-1;
  const plat = (logDraft.opponentPlatforms&&logDraft.opponentPlatforms[idx])||'';
  const cty = (logDraft.opponentCountries&&logDraft.opponentCountries[idx])||'';
  return `<div class="field" style="flex:2.3; min-width:300px">
    <label>Their gamertag ${i}</label>
    <div class="tagrow">
      <input type="text" id="f-tag${i}" class="tg-in" value="${esc(logDraft.opponentGamertags[idx]||'')}">
      <span class="ddrop" data-kind="plat" data-idx="${i}">
        <button type="button" class="ddrop-btn" id="dd-plat-${i}" title="Console or PC"><span class="ddrop-val"></span><span class="chev">▾</span></button>
        <span class="ddrop-pop">
          <span class="ddrop-opt" data-val="console">${ICONS.gamepad}<span>Console</span></span>
          <span class="ddrop-opt" data-val="pc">${ICONS.monitor}<span>PC</span></span>
        </span>
      </span>
      <span class="ddrop cty" data-kind="cty" data-idx="${i}">
        <button type="button" class="ddrop-btn" id="dd-cty-${i}" title="Country (flag only)"><span class="ddrop-val"></span><span class="chev">▾</span></button>

          <div class="ddrop-list"></div>

      </span>
      <input type="hidden" id="f-plat${i}" value="${esc(plat)}">
