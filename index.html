/* Highlight cells that hold a real value (rating entered, or goals/assists > 0),
   so played vs. sat-out players are instantly visible. */
function paintStatHighlights(){
  document.querySelectorAll('#playerstat-rows .ocr-row').forEach(row=>{
    const r=row.querySelector('[data-f=rating]'), g=row.querySelector('[data-f=goals]'), a=row.querySelector('[data-f=assists]');
    if(r) r.classList.toggle('hasval', r.value.trim()!=='');
    if(g) g.classList.toggle('hasval', Number(g.value)>0);
    if(a) a.classList.toggle('hasval', Number(a.value)>0);
  });
}
function teamStatLine(label, forVal, againstVal){
  const key = label.toLowerCase().replace(/[^a-z0-9]+/g,'_');
  return `<div class="statline" data-key="${key}" data-label="${esc(label)}">
    <input type="text" data-side="for" value="${forVal!=null?esc(forVal):''}">
    <div class="lbl">${esc(label)}</div>
    <input type="text" data-side="against" value="${againstVal!=null?esc(againstVal):''}">
  </div>`;
}

function readDraftFromForm(){
  const g = logDraft;
  const val = id => document.getElementById(id)?.value;
  g.seasonId = val('f-season');
  g.teamId = (val('f-team')==='__new') ? (g.teamId||'') : (val('f-team')||'');
  g.opponentTeam = val('f-opp');
  g.homeAway = val('f-homeaway');
  g.opponentGamertags = [val('f-tag1')||'', val('f-tag2')||''];
  g.opponentPlatforms = [val('f-plat1')||'', val('f-plat2')||''];
  g.opponentCountries = [val('f-cty1')||'', val('f-cty2')||''];
  g.scoreFor = Number(val('f-scorefor')||0);
  g.scoreAgainst = Number(val('f-scoreagainst')||0);
  g.rageQuit = val('f-rq');
  g.disconnect = val('f-dc')==='1';
  const motmBox = document.querySelector('#playerstat-rows .ocr-row [data-f=motm]:checked');
  g.motmPlayerId = motmBox ? motmBox.closest('.ocr-row').querySelector('[data-f=playerId]').value : '';
  document.querySelectorAll('#playerstat-rows .ocr-row').forEach((row,i)=>{
    const ps = g.playerStats[i]; if(!ps) return;
    ps.position = row.querySelector('[data-f=position]').value;
    ps.playerId = row.querySelector('[data-f=playerId]').value;
    ps.rating = row.querySelector('[data-f=rating]').value;
    ps.goals = Number(row.querySelector('[data-f=goals]').value||0);
    ps.assists = Number(row.querySelector('[data-f=assists]').value||0);
  });
  const stats = {for:{}, against:{}};
  document.querySelectorAll('#teamstat-rows .statline, #teamstat-custom .statline').forEach(row=>{
    const label = row.dataset.label;
    const fv = row.querySelector('[data-side=for]').value;
    const av = row.querySelector('[data-side=against]').value;
    if(fv!=='') stats.for[label] = fv;
    if(av!=='') stats.against[label] = av;
  });
  g.teamStats = stats;
}

function wireLogHandlers(){
  const seasonSel = document.getElementById('f-season');
  if(seasonSel) seasonSel.addEventListener('change', (e)=>{
    logDraft.seasonId = e.target.value;
    const s = seasonById(logDraft.seasonId);
    logDraft.teamId = seasonPrimaryTeamId(s);
    if(!editingGameId){
      logDraft.playerStats = s ? squadForSeason(s).map(pid=>({playerId:pid, position:'', rating:'', goals:0, assists:0})) : [];
    }
    render();
  });
  const teamSel = document.getElementById('f-team');
  if(teamSel) teamSel.addEventListener('change', async (e)=>{
    if(e.target.value==='__new'){
      const prev = logDraft.teamId||'';
      const name = (prompt('New team name:')||'').trim();
      if(!name){ e.target.value = prev; render(); return; }
      const tid = await dbAdd('teams', {name, playerIds:[]});
      logDraft.teamId = tid;
      if(!editingGameId) logDraft.playerStats = [];
      toast(`Team "${name}" created — it's now part of this season`);
      render();
      return;
    }
    logDraft.teamId = e.target.value;
    if(!editingGameId){
      const t = teamById(logDraft.teamId);
      logDraft.playerStats = t ? (t.playerIds||[]).map(pid=>({playerId:pid, position:'', rating:'', goals:0, assists:0})) : [];
    }
    render();
  });
  document.getElementById('add-playerstat')?.addEventListener('click', async ()=>{
    readDraftFromForm();
    const name = prompt('Player name (new names are added to the player list automatically):');
    if(!name || !name.trim()) return;
    const playerId = await resolveOrCreatePlayer(name);
    logDraft.playerStats.push({playerId, position:'', rating:'', goals:0, assists:0});
    render();
  });
  document.getElementById('playerstat-rows')?.addEventListener('click', (e)=>{
    const rn = e.target.closest('[data-rename]');
    if(rn){
      const pid = rn.closest('.ocr-row').querySelector('[data-f=playerId]').value;
      readDraftFromForm();
      renamePlayer(pid);
      return;
    }
    const rm = e.target.closest('[data-remove]');
    if(rm){ readDraftFromForm(); logDraft.playerStats.splice(Number(rm.dataset.remove),1); render(); }
  });
  document.getElementById('playerstat-rows')?.addEventListener('change', (e)=>{
    if(!e.target || !e.target.matches('[data-f=motm]')) return;
    if(e.target.checked) document.querySelectorAll('#playerstat-rows [data-f=motm]').forEach(cb=>{ if(cb!==e.target) cb.checked=false; });
    readDraftFromForm();
  });
  document.querySelectorAll('[data-rename-player]').forEach(b=> b.addEventListener('click', ()=> renamePlayer(b.dataset.renamePlayer)));
  paintStatHighlights();
  document.getElementById('playerstat-rows')?.addEventListener('input', paintStatHighlights);
  document.getElementById('add-teamstat')?.addEventListener('click', ()=>{
    const label = prompt('Stat name (e.g. "Corners")'); if(!label) return;
    document.getElementById('teamstat-custom').insertAdjacentHTML('beforeend', teamStatLine(label));
  });
  document.getElementById('cancel-edit')?.addEventListener('click', ()=>{
    editingGameId = null;
    logDraft = null;
    setTab('history');
  });
  document.getElementById('save-match')?.addEventListener('click', async ()=>{
    readDraftFromForm();
    if(!logDraft.seasonId){ toast('Pick a season first'); return; }
    const {seasonId, ...rest} = logDraft;
    if(editingGameId){
      const orig = games.find(g=>g.id===editingGameId);
      await dbSet('games', editingGameId, {seasonId, ...rest, gameNumber: orig?.gameNumber||1, createdAt: orig?.createdAt||Date.now()});
    } else {
      const existingCount = gamesFor(seasonId).length;
      await dbAdd('games', {seasonId, ...rest, gameNumber: existingCount+1, createdAt: Date.now()});
    }
    const s = seasonById(seasonId);
    if(s){
      const playedIds = (rest.playerStats||[]).map(p=>p.playerId).filter(Boolean);
      const combined = Array.from(new Set([...(s.squadIds||[]), ...playedIds]));
      if(combined.length !== (s.squadIds||[]).length){
        await dbSet('seasons', s.id, {...stripId(s), squadIds: combined});
      }
      /* Mid-season switch: if this match's team is new to the season, add it to the
         season's ordered team list (shown as "Team A / Team B"). */
      if(rest.teamId){
        const base = (s.teamIds && s.teamIds.length) ? [...s.teamIds] : (s.teamId ? [s.teamId] : []);
        if(!base.includes(rest.teamId)){
          await dbSet('seasons', s.id, {...stripId(s), teamIds: [...base, rest.teamId]});
        }
      }
      const t = (rest.teamId && teamById(rest.teamId)) || (s.teamId ? teamById(s.teamId) : null);
      if(t){
        const combinedT = Array.from(new Set([...(t.playerIds||[]), ...playedIds]));
        if(combinedT.length !== (t.playerIds||[]).length){
          await dbSet('teams', t.id, {...stripId(t), playerIds: combinedT});
        }
      }
    }
    toast(editingGameId ? 'Match updated' : 'Match saved');
    editingGameId = null;
    logDraft = null;
    setTab('history');
  });

  wireScan('scan-players-input','scan-players','scan-players-progress', scanPlayerImages);
  wireScan('scan-team-input','scan-team','scan-team-progress', scanTeamImage);

  /* Slim PLAYERS-screen scan box (paste or choose a file). */
  const metaBox = document.getElementById('scan-meta');
  const metaInput = document.getElementById('scan-meta-input');
  if(metaBox && metaInput){
    const run = async (files)=>{
      if(!files.length) return;
      metaBox.classList.add('active');
      try{ await scanPlayersScreen(files, 'scan-meta-progress'); } finally { metaBox.classList.remove('active'); }
    };
    metaInput.addEventListener('change', async (e)=>{ const files=Array.from(e.target.files||[]); await run(files); e.target.value=''; });
    document.getElementById('scan-meta-choose')?.addEventListener('click', (e)=>{ e.stopPropagation(); metaInput.click(); });
    metaBox.addEventListener('click', (e)=>{ if(e.target.closest && e.target.closest('button')) return; metaBox.focus(); }); // click = focus (for Ctrl+V); only “choose” opens the file dialog
    metaBox.addEventListener('paste', async (e)=>{
      const items = Array.from(e.clipboardData?.items || []);
      const files = items.filter(it=>it.type && it.type.startsWith('image/')).map(it=>it.getAsFile()).filter(Boolean);
      if(!files.length) return;
      e.preventDefault();
      await run(files);
    });
  }
  paintDdrops();
}

/* ---- Scanning, via Tesseract.js OCR (works normally here — no restrictive CSP on GitHub Pages) ---- */
let ocrWorkerPromise = null;
let ocrLoggerTarget = null;
/* Bump on every scanner change — shown in the scan box so we can tell which build a
   browser is actually running (browsers cache this page aggressively). */
const SCAN_BUILD = 'v8';

const OCR_PHASE_LABELS = {
  'loading tesseract core': 'Loading OCR engine (first time only)…',
  'initializing tesseract': 'Starting OCR engine…',
  'loading language traineddata': 'Downloading language data (first time only)…',
  'initializing api': 'Preparing scan…',
  'recognizing text': 'Reading image…'
};
function ocrLogger(m){
  if(!ocrLoggerTarget) return;
  const label = OCR_PHASE_LABELS[m.status] || m.status;
  const pct = m.progress!=null ? Math.round(m.progress*100) : null;
  ocrLoggerTarget.innerHTML = `<div class="hint">${esc(label)}${pct!=null?' '+pct+'%':''}</div><div class="progress"><div style="width:${pct||0}%"></div></div>`;
}
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker('eng', 1, { logger: ocrLogger }).catch(err=>{ ocrWorkerPromise = null; throw err; });
  }
  return ocrWorkerPromise;
}
function withTimeout(promise, ms, label){
  let t;
  const timeout = new Promise((_,reject)=>{ t = setTimeout(()=> reject(new Error(`${label} timed out`)), ms); });
  return Promise.race([promise.finally(()=>clearTimeout(t)), timeout]);
}

/* Preprocess the screenshot before OCR. Tesseract is far more accurate on crisp dark-on-light
   text, so: upscale, grayscale, contrast-stretch (2nd–98th percentile), and invert when the
   screenshot is mostly dark (the game UI is). Falls back to the raw file if anything fails. */
async function preprocessForOcr(file, opts){
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.max(1, Math.min(2.2, 1800/bmp.width));
    const w = Math.round(bmp.width*scale), h = Math.round(bmp.height*scale);
    const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(bmp, 0, 0, w, h);
    const img = ctx.getImageData(0,0,w,h);
    const d = img.data, n = w*h;
    const gray = new Float32Array(n);
    let mean = 0;
    for(let i=0;i<n;i++){
      const v = (d[i*4]*299 + d[i*4+1]*587 + d[i*4+2]*114)/10;
      gray[i] = v; mean += v;
    }
    const invert = mean/n < 128; // mostly-dark UI screenshot → flip to dark text on light bg
    const hist = new Uint32Array(256);
    for(let i=0;i<n;i++) hist[gray[i]<0?0:(gray[i]>255?255:gray[i]|0)]++;
    let lo=0, hi=255, acc=0;
    for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>n*0.02){ lo=i; break; } }
    acc=0;
    for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>n*0.02){ hi=i; break; } }
    const range = Math.max(1, hi-lo);
    const out = new Uint8ClampedArray(n);
    for(let i=0;i<n;i++){
      let v = (gray[i]-lo)/range*255;
      if(invert) v = 255-v;
      v = v<0?0:(v>255?255:v);
      out[i]=v;
    }
    if(opts && opts.binarize){
      // Otsu threshold → pure black text on pure white. Kills the grass-stripe
      // texture that makes Tesseract drop half the words on the Summary screen.
      const hist = new Uint32Array(256);
      for(let i=0;i<n;i++) hist[out[i]]++;
      let sum=0; for(let i=0;i<256;i++) sum += i*hist[i];
      let wB=0, sumB=0, best=0, thr=127;
      for(let i=0;i<256;i++){
        wB += hist[i]; if(!wB) continue;
        const wF = n-wB; if(!wF) break;
        sumB += i*hist[i];
        const mB = sumB/wB, mF = (sum-sumB)/wF;
        const v = wB*wF*(mB-mF)*(mB-mF);
        if(v>best){ best=v; thr=i; }
      }
      for(let i=0;i<n;i++) out[i] = out[i] > thr ? 255 : 0;
    }
    for(let i=0;i<n;i++){ d[i*4]=d[i*4+1]=d[i*4+2]=out[i]; d[i*4+3]=255; }
    ctx.putImageData(img, 0, 0);
    return await new Promise(res=> cv.toBlob(b=>res(b||file), 'image/png'));
  }catch(e){ return file; }
}

/* Returns one `data` result (with .blocks word-position tree) per image — NOT concatenated text,
   because reconstructing table rows needs each word's actual pixel position, not Tesseract's own
   line-breaking (which falls apart on UIs with big gaps between columns like this one). */
/* `variants` = list of preprocess option-sets to run (e.g. [{}, {binarize:true}]).
   Each pass is OCR'd separately; the result with the most words wins, and every
   pass's words are kept in `data._variantWords` so callers can merge them. */
async function ocrReadFiles(files, progId, variants){
  variants = (variants && variants.length) ? variants : [{}];
  const prog = document.getElementById(progId);
  ocrLoggerTarget = prog;
  const worker = await withTimeout(getOcrWorker(), 45000, 'Loading the OCR engine');
  const countWords = d => flattenWords(d).length;
  const results = [];
  for(let i=0;i<files.length;i++){
    const passes = [];
    for(const v of variants){
      try{
        const src = await preprocessForOcr(files[i], v);
        const data = (await withTimeout(worker.recognize(src), 45000, 'Reading the image')).data;
        data._orig = files[i]; data._src = src; data._procWords = countWords(data);
        passes.push(data);
      }catch(e){
        if(variants.length===1) throw e; // single-pass flow: surface the error as before
        console.warn('OCR pass failed, continuing with the others', e);
      }
    }
    if(!passes.length) throw new Error('OCR engine did not load');
    let data = passes.slice().sort((a,b)=> b._procWords-a._procWords)[0];
    // Self-heal: if everything came out nearly empty (some browser pastes mangle the
    // colors), re-read the ORIGINAL file and keep whichever actually worked.
    if(data._procWords < 20){
      try{
        const raw = (await withTimeout(worker.recognize(files[i]), 45000, 'Reading the image')).data;
        if(countWords(raw) > data._procWords){
          data = raw; data._procWords = countWords(data); data._usedRaw = true; data._src = files[i]; data._orig = files[i];
        }
        // NOTE: wrap in an extra array — concat() would otherwise splice the raw
        // word objects in as top-level entries (they must stay one list among others).
        data._variantWords = passes.map(p=>flattenWords(p)).concat([flattenWords(raw)]);
      }catch(e){ /* keep the preprocessed result */ }
    } else {
      data._variantWords = passes.map(p=>flattenWords(p));
    }
    results.push(data);
  }
  ocrLoggerTarget = null;
  return results;
}

/* Union of several word-lists (one per OCR pass) — a word present in more than one
   pass (near-identical bbox) is counted once. */
function mergeWords(lists){
  const out = [];
  (lists||[]).filter(l=> Array.isArray(l)).forEach(list=>{
    (list||[]).forEach(w=>{
      const t = (w.text||'').trim(); if(!t) return;
      const cx = (w.bbox.x0+w.bbox.x1)/2, cy = (w.bbox.y0+w.bbox.y1)/2;
      const h = Math.max(4, w.bbox.y1-w.bbox.y0);
      if(out.some(o=> o.t===t.toLowerCase() && Math.abs(o.cx-cx)<h*0.9 && Math.abs(o.cy-cy)<h*0.9)) return;
      out.push({text:t, t:t.toLowerCase(), bbox:w.bbox, cx, cy, h});
    });
  });
  return out;
}

/* Walk Tesseract's blocks→paragraphs→lines→words tree and flatten to a plain word list with bbox,
   ignoring Tesseract's own line grouping entirely. */
function flattenWords(data){
  const words = [];
  (data.blocks||[]).forEach(block=>{
    (block.paragraphs||[]).forEach(par=>{
      (par.lines||[]).forEach(line=>{
        (line.words||[]).forEach(w=>{
          const t = (w.text||'').trim();
          if(t) words.push({text:t, bbox:w.bbox});
        });
      });
    });
  });
  return words;
}

/* Reconstruct visual rows purely from each word's vertical position — this is what makes
   wide-gapped table UIs work, since it ignores wherever Tesseract itself decided a line broke. */
function clusterRows(words){
  const sorted = [...words].sort((a,b)=> a.bbox.y0 - b.bbox.y0);
  const rows = [];
  let current = null;
  sorted.forEach(w=>{
    const cy = (w.bbox.y0 + w.bbox.y1)/2;
    const h = w.bbox.y1 - w.bbox.y0;
    if(!current || Math.abs(cy - current.cy) > Math.max(current.h, h) * 0.65){
      current = {cy, h, words:[]};
      rows.push(current);
    }else{
      current.cy = (current.cy*current.words.length + cy)/(current.words.length+1);
      current.h = Math.max(current.h, h);
    }
    current.words.push(w);
  });
  rows.forEach(r=> r.words.sort((a,b)=> a.bbox.x0 - b.bbox.x0));
  return rows;
}

/* Find the table header row (POS / Name / RR / G / AST) and record each column's x-center.
   Anchoring on the header lets us decide which number sits in which column — this kills the
   "7.1 misread as 71 and filed under Goals" class of errors. */
function findColumnAnchors(rows){
  // The POS/Name labels get garbled by OCR ("a A on …") but the RR / G / AST column
  // headers read reliably — anchor on those three, which is all the parser needs.
  for(const row of rows){
    const a = {};
    row.words.forEach(w=>{
      const t = w.text.toLowerCase().replace(/[^a-z]/g,'');
      const cx = (w.bbox.x0+w.bbox.x1)/2;
      if(t==='pos' && a.pos==null) a.pos = cx;
      else if(t==='name' && a.name==null) a.name = cx;
      else if(t==='rr' && a.rr==null) a.rr = cx;
      else if(t==='g' && a.g==null) a.g = cx;
      else if(t==='ast' && a.ast==null) a.ast = cx;
    });
    if(a.rr!=null && a.g!=null && a.ast!=null){ a.headerCy = row.cy; return a; }
  }
  return null;
}

/* A player-performance row is: [optional POS] Name (one or more words) [Rating|N/A] Goals Assists.
   With column anchors, each number is assigned to the column it visually sits under, and a
   number that lands in the wrong column (or is too big for a single match) is dropped instead
   of misfiled. Without anchors we fall back to the old right-to-left heuristic. */
function parsePlayerRow(rowWords, anchors){
  // Tesseract spits out junk like "0)", "o", "oO", "(0" around digits — strip the junk
  // (keeping letters, digits, . - ' / and accented characters) before pattern matching.
  const keep = ch => /[A-Za-z0-9.\/'-\u00C0-\u017F]/.test(ch);
  const clean = s => {
    let i=0, j=s.length-1;
    while(i<j && !keep(s[i])) i++;
    while(j>i && !keep(s[j])) j--;
    return s.slice(i, j+1).trim();
  };
  const toks = rowWords.map(w=>({text:clean(w.text), cx:(w.bbox.x0+w.bbox.x1)/2})).filter(t=>t.text);
  if(toks.length < 3) return null;
  const isInt = t=>/^\d{1,3}$/.test(t) || /^[oO]$/.test(t);   // "O" is a misread zero
  const isRate = t=>/^\d{1,2}[.,]\d$/.test(t) || /^n\/?a$/i.test(t);
  const col = t=>{
    if(!anchors) return null;
    let best=null, bd=Infinity;
    [['rr',anchors.rr],['g',anchors.g],['ast',anchors.ast]].forEach(p=>{
      if(p[1]==null) return;
      const d=Math.abs(t.cx-p[1]); if(d<bd){bd=d;best=p[0];}
    });
    return best;
  };
  let goalsIdx=-1, assistsIdx=-1, ratingIdx=-1;
  if(anchors){
    toks.forEach((t,i)=>{
      const c = col(t);
      if(c==='ast' && isInt(t.text) && assistsIdx===-1) assistsIdx=i;
      else if(c==='g' && isInt(t.text) && goalsIdx===-1) goalsIdx=i;
      else if(c==='rr' && (isRate(t.text) || /^\d{3}$/.test(t.text)) && ratingIdx===-1) ratingIdx=i;
    });
    if(goalsIdx===-1 && assistsIdx===-1 && ratingIdx===-1) return null;
  } else {
    for(let i=toks.length-1;i>=0;i--){
      if(isInt(toks[i].text)){
        if(assistsIdx===-1) assistsIdx=i;
        else { goalsIdx=i; break; }
      }
    }
    if(goalsIdx===-1 || assistsIdx===-1 || goalsIdx>=assistsIdx) return null;
    if(goalsIdx-1>=0 && (isRate(toks[goalsIdx-1].text) || /^\d{3}$/.test(toks[goalsIdx-1].text))) ratingIdx = goalsIdx-1;
  }
  const idxs = [ratingIdx, goalsIdx, assistsIdx].filter(i=>i!==-1);
  const nameEnd = idxs.length ? Math.min(...idxs) : toks.length;
  let nameTokens = toks.slice(0, nameEnd).filter(t=>!/^[oO]$/.test(t.text)); // lone "O" is a misread zero, never a name
  let position = '';
  if(nameTokens.length>1 && /^[A-Z]{2,4}$/.test(nameTokens[0].text)){
    position = nameTokens[0].text.replace(/[^A-Za-z]/g,'');
    nameTokens = nameTokens.slice(1);
  }
  const name = nameTokens.map(t=>t.text).join(' ')
    .replace(/[^A-Za-z.'\-\u00C0-\u017F ]/g,'').replace(/\s+/g,' ').trim();
  if(!name || /^\d/.test(name) || /\d/.test(name) || /^(pos|name|rr|g|ast|player|performance)$/i.test(name)) return null;
  const val = i => i===-1 ? 0 : (toks[i].text==='O' || toks[i].text==='o' ? 0 : Number(toks[i].text));
  let goals = val(goalsIdx);
  let assists = val(assistsIdx);
  if(goals>30) goals=0;     // impossible in one match → misread number, drop it
  if(assists>30) assists=0;
  let rating = '';
  if(ratingIdx!==-1){
    const rt = toks[ratingIdx].text;
    if(/^\d{1,2}[.,]\d$/.test(rt)) rating = rt.replace(',','.');
    else if(/^\d{3}$/.test(rt)){ const v = Number(rt)/10; if(v>=1 && v<=10) rating = v.toFixed(1); } // "100" → 10.0
  }
  return {position, name, rating, goals, assists};
}

/* ================= SUMMARY (MATCH FACTS) SCREEN PARSER =================
   Layout:  [left value]  STAT LABEL  [right value]   — the center column,
   plus three big % circles in the left/right margins (Dribble / Shot / Pass)
   whose label sits BELOW the number. In EA FC the home team is always the
   LEFT column, so left/right are mapped to us/them from the Home/Away pick.
   Purely positional (word bounding boxes), tolerant of OCR mangling and of
   extra numbers merged into a row. Deliberately separate from — and it never
   touches — the player-rating scanner or its rules. */
const CIRCLE_WORDS = {dribble:'Dribble Success Rate', shot:'Shot Accuracy', pass:'Pass Accuracy %'};
const CIRCLE_LABELS = Object.values(CIRCLE_WORDS);

function parseSummaryScreen(words){
  if(!words || !words.length) return null;
  let W=0, H=0;
  words.forEach(w=>{ W=Math.max(W,w.bbox.x1); H=Math.max(H,w.bbox.y1); });
  if(!W) return null;

  /* Drop words with abnormally tall boxes (e.g. a circle-ring artifact OCR'd as "(80%)"
     spanning three rows) — left in, they would swallow neighbouring table rows when the
     words are clustered into visual lines. */
  const hs = words.map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b);
  const medH = hs[Math.floor(hs.length/2)] || 10;
  const clean = words
    .filter(w=>(w.bbox.y1-w.bbox.y0) <= Math.max(3*medH, 60))
    .map(w=>{
      const b=w.bbox;
      return {text:(w.text||'').trim(), t:(w.text||'').trim().toLowerCase(),
        x0:b.x0, x1:b.x1, y0:b.y0, y1:b.y1, bbox:b,
        cx:(b.x0+b.x1)/2, cy:(b.y0+b.y1)/2, h:Math.max(1,b.y1-b.y0)};
    })
    .filter(w=>w.text);

  /* OCR wraps values in bar/bracket junk ("|15", "l2", "[0]") — strip it and keep the
     number. A lone "o" is Tesseract's classic misread zero. Returns the cleaned number
     string, or null if the token is not a number. */
  const cleanNum = t=>{
    let s = String(t).trim().replace(/%+\s*$/,'').replace(/^\s*%+/,'');
    s = s.replace(/^[|\[\]()lLIi]+/,'').replace(/[|\[\]()]+$/,'');
    if(/^[oO]$/.test(s)) return '0';
    if(/^-?\d{1,4}(\.\d{1,3})?$/.test(s)) return s;
    return null;
  };

  /* A token counts as a label word only if it carries at least 2 real letters.
     Punctuation-only tokens ("|" bars, brackets, "°", "[+]") are junk: neither label
     nor number, so they must never extend a label span or shadow a value. */
  const letterCount = t => (String(t).match(/[A-Za-zÀ-ſ]/g)||[]).length;
  const isWord = t => letterCount(t) >= 2;

  const left={}, right={};
  const zone = cx => cx < W*0.35 ? 'outer' : cx > W*0.65 ? 'outer' : 'center';
  const rows = clusterRows(clean);

  /* A visual row can hold several labels side by side (the "Expected Goals" row merges
     with a circle-label row). Split each row's label words into x-gap groups and treat
     each group as its own label. */
  const labelGroups = row=>{
    const lab = row.words
      .filter(w=> cleanNum(w.text)==null && isWord(w.text))
      .sort((a,b)=> a.x0-b.x0);
    const groups = [];
    lab.forEach(w=>{
      const last = groups[groups.length-1];
      if(last && w.x0 - last.x1 <= Math.max(120, 6*medH)) last.words.push(w), last.x1 = Math.max(last.x1, w.x1);
      else groups.push({x0:w.x0, x1:w.x1, words:[w]});
    });
    return groups;
  };

  /* The value closest to a label group on one side: L = rightmost number left of the
     span, R = leftmost number right of it. Numbers inside/adjacent to the span are
     label junk and must never shadow the real value. */
  const valueNear = (row, g, side)=>{
    const margin = Math.max(...g.words.map(w=>w.h)) * 0.9;
    const pool = side==='L'
      ? row.words.filter(w=> cleanNum(w.text)!=null && w.cx < g.x0 - margin)
      : row.words.filter(w=> cleanNum(w.text)!=null && w.cx > g.x1 + margin);
    pool.sort((a,b)=> side==='L' ? b.x0-a.x0 : a.x0-b.x0);
    return pool[0] || null;
  };

  /* Two OCR passes can leave two readings of the same cell ("39" and "139"). For xG —
     a small decimal in a single match — prefer the reading that recovers a sensible
     value (3-4 digits = dropped decimal point) over a bare 1-2 digit integer. */
  const xgScore = nv=>{
    if(nv==null) return -1;
    if(/^\d{3,4}$/.test(nv)) return 3;        // "139" → 1.39
    if(/^\d+\.\d+$/.test(nv)) return 2;      // already a decimal
    return nv.replace(/\D/g,'').length;      // 1-2 digit integers: weak
  };
  const preferXgReading = (row, g, side, cur)=>{
    if(!cur) return null;
    const margin = Math.max(...g.words.map(w=>w.h)) * 0.9;
    let best = cur;
    row.words.forEach(v=>{
      if(cleanNum(v.text)==null) return;
      if(side==='L' ? v.cx >= g.x0 - margin : v.cx <= g.x1 + margin) return;
      if(Math.abs(v.cx - cur.cx) > Math.max(40, 4*medH)) return;  // a different cell, not a re-reading
      if(xgScore(cleanNum(v.text)) > xgScore(cleanNum(best.text))) best = v;
    });
    return best;
  };

  /* --- center table rows: [left value]  STAT LABEL  [right value] --- */
  rows.forEach(row=>{
    labelGroups(row).forEach(g=>{
      if(zone((g.x0+g.x1)/2)!=='center') return;   // margin groups are circles — handled below
      const labelWords = g.words.map(w=>w.t);
      let best=null;
      STAT_LABELS.forEach(canon=>{
        if(CIRCLE_LABELS.includes(canon)) return;  // circles are handled separately
        const cw = canon.toLowerCase().replace(/[%(].*$/,'').split(' ').filter(x=>x.length>2);
        if(!cw.length) return;
        let hit=0;
        const hitWordIdx = new Set();
        cw.forEach(c=>{
          labelWords.forEach((w, wi)=>{
            if(w.includes(c)
              || (w.length>=2 && c.startsWith(w))
              || (c.length>=3 && w.length>=Math.ceil(c.length*0.6) && w.startsWith(c))) { hit++; hitWordIdx.add(wi); }
          });
        });
        if(hit < 1) return;
        /* Label words that match NOTHING about this stat are a red flag — they keep a
           near-miss ("def line breaks attempted") from filing under the wrong stat
           ("passes attempted"). Better an empty box than a wrong number. */
        const extra = labelWords.length - hitWordIdx.size;
        const score = hit*2 - (cw.length-hit) - extra;
        if(score < 1) return;
        if(!best || score>best.score || (score===best.score && cw.length<best.cw)) best={canon, score, cw:cw.length};
      });
      if(!best) return;
      let L = valueNear(row, g, 'L');
      let R = valueNear(row, g, 'R');
      if(best.canon==='Expected Goals'){ L = preferXgReading(row, g, 'L', L); R = preferXgReading(row, g, 'R', R); }
      let lv = L ? cleanNum(L.text) : null;
      let rv = R ? cleanNum(R.text) : null;
      /* xG is small in a single match — a 2-4 digit integer is a dropped decimal point
         ("I396" = 3.96, "139" = 1.39, "39" = 3.9). Reinsert it after the first digit. */
      const fixXg = v => (best.canon==='Expected Goals' && /^\d{2,4}$/.test(v)) ? v.slice(0,1)+'.'+v.slice(1) : v;
      if(lv!=null) left[best.canon] = fixXg(lv);
      if(rv!=null) right[best.canon] = fixXg(rv);
    });
  });

  /* --- margin circles: big % number directly ABOVE a label like "DRIBBLE SUCCESS RATE" ---
     Align to the whole label GROUP (not one word, not the merged row) and to the
     correct half of the screen. */
  Object.entries(CIRCLE_WORDS).forEach(([word, canon])=>{
    clean.forEach(w=>{
      if(!(w.t.includes(word) && w.t.length<=word.length+3)) return;  // dribble / shot / pass(es)
      if(zone(w.cx)!=='outer') return;                                 // ignore "Passes", "Shooting" etc.
      if(w.cy < H*0.15) return;                                        // ignore the tab bar
      const side = w.cx < W/2 ? 'left' : 'right';
      const row = rows.find(r=> r.words.indexOf(w) !== -1);
      if(!row) return;
      const g = labelGroups(row).find(x=> x.words.indexOf(w)!==-1) || {x0:w.x0, x1:w.x1, words:[w]};
      const top = Math.min(...g.words.map(x=>x.y0));
      /* A circle's number sits a fixed short distance above its label; the neighbouring
         circle's number is far higher. Cap the gap so one circle never steals another's
         value. */
      const maxGap = Math.max(150, 8*medH);
      let cand=null;  // {nv, digits, gap}
      clean.forEach(v=>{
        const nv = cleanNum(v.text);
        if(nv==null) return;
        if(v.y1 > top + 2) return;                                     // must sit above the label
        if(side==='left'  && v.cx > W/2) return;                       // same half of the screen
        if(side==='right' && v.cx < W/2) return;
        if(v.cx < g.x0 - 30 || v.cx > g.x1 + 30) return;               // roughly above the label
        const digits = nv.replace(/\D/g,'').length;
        const gap = top - v.y1;
        if(gap > maxGap) return;                                       // belongs to another circle
        if(!cand || digits>cand.digits || (digits===cand.digits && gap<cand.gap)) cand={nv, digits, gap};
      });
      if(!cand) return;
      if(side==='left') left[canon]=cand.nv; else right[canon]=cand.nv;
    });
  });

  if(!Object.keys(left).length && !Object.keys(right).length) return null;
  return {left, right};
}

/* A team-stat row is: [for value] Label text… [against value] */
function parseTeamStatRow(rowWords){
  const toks = rowWords.map(w=>w.text).filter(Boolean);
  if(toks.length < 3) return null;
  const isNum = t => /^[\d.]+%?$/.test(t);
  if(!isNum(toks[0]) || !isNum(toks[toks.length-1])) return null;
  const forVal = toks[0].replace('%','');
  const againstVal = toks[toks.length-1].replace('%','');
  const label = toks.slice(1, toks.length-1).join(' ').trim();
  if(!label) return null;
  return {label, for:forVal, against:againstVal};
}

function recomputeMotmGuess(){
  let best = null;
  (logDraft.playerStats||[]).forEach(ps=>{
    const r = parseFloat(ps.rating);
    if(!isNaN(r) && (!best || r > best.r)) best = {r, playerId: ps.playerId};
  });
  if(best) logDraft.motmPlayerId = best.playerId;
}

async function scanPlayerImages(files, progId){
  const prog = document.getElementById(progId);
  prog.innerHTML = `<div class="hint">Starting…</div>`;
  try{
    if(typeof Tesseract === 'undefined') throw new Error('OCR engine did not load');
    const results = await ocrReadFiles(files, progId);
    const found = [];
    results.forEach(data=>{
      const rows = clusterRows(flattenWords(data));
      const anchors = findColumnAnchors(rows);
      // Skip everything above the header (the "89 · Alexander Isak" highlight card etc.)
      const dataRows = anchors ? rows.filter(r=>r.cy > anchors.headerCy) : rows;
      dataRows.forEach(row=>{
        const parsed = parsePlayerRow(row.words, anchors||null);
        if(parsed) found.push(parsed);
      });
    });
    if(!found.length){
      const totalWords = results.reduce((s,d)=> s + (d._procWords||flattenWords(d).length), 0);
      const usedRaw = results.some(d=>d._usedRaw);
      const thumb = (blob, label)=>{
        if(!blob || typeof URL.createObjectURL !== 'function') return '';
        return `<div><div class="sub" style="margin-bottom:4px">${label}</div><img src="${URL.createObjectURL(blob)}" style="max-width:130px; max-height:170px; border-radius:8px; border:1px solid var(--line); display:block"></div>`;
      };
      const previews = results.map((d,i)=>{
        const a = thumb(d._src, `Image ${i+1}: ${d._usedRaw ? 'as OCR saw it (original)' : 'as OCR saw it'}`);
        const b = (d._orig && d._src !== d._orig) ? thumb(d._orig, `Image ${i+1}: original file`) : '';
        return (a||b) ? `<div style="margin-top:10px; display:flex; gap:14px; align-items:flex-start">${a}${b}</div>` : '';
      }).join('');
      prog.innerHTML = `<div class="hint" style="color:var(--red)">No player rows recognized (OCR read ${totalWords} word(s)) — try re-pasting a sharper screenshot or enter manually.${usedRaw ? ' (The enhanced version failed, so the scanner fell back to the original image — the preview shows what it saw.)' : ''} If it keeps failing, send us the small preview below and we'll see exactly what the scanner received.</div>${previews}`;
      return;
    }
    readDraftFromForm();
    for(const f of found){
      const playerId = await resolveOrCreatePlayer(f.name);
      const row = {playerId, position:f.position, rating:f.rating, goals:f.goals, assists:f.assists};
      const idx = logDraft.playerStats.findIndex(ps=>ps.playerId===playerId);
      if(idx>-1) logDraft.playerStats[idx] = row; else logDraft.playerStats.push(row);
    }
    recomputeMotmGuess();
    render();
    toast(`Filled in ${found.length} player row(s) — MOTM guessed as the highest rating, check it's right`);
    const prog2 = document.getElementById(progId);
    if(prog2) prog2.innerHTML = `<div class="hint" style="color:var(--turf)">Scan complete — review the rows below (and the Man of the Match pick), then paste another screenshot or save.</div>`;
  }catch(err){
    const timedOut = /timed out/.test(err.message||'');
    prog.innerHTML = `<div class="hint" style="color:var(--red)">${timedOut ? "This is taking too long — check your connection." : `Couldn't read that image automatically (${esc(err.message||'scan failed')}).`} Just type the values in below for now.</div>`;
  }
}

async function scanTeamImage(files, progId){
  const prog = document.getElementById(progId);
  prog.innerHTML = `<div class="hint">Starting…</div>`;
  try{
    if(typeof Tesseract === 'undefined') throw new Error('OCR engine did not load');
    // Two OCR passes (normal + hard binarized), merged — the grass-stripe background
    // makes Tesseract drop words on this screen, and the second pass catches them.
    const results = await ocrReadFiles(files, progId, [{}, {binarize:true}]);
    const homeAway = (logDraft && logDraft.homeAway) ? logDraft.homeAway : 'home';
    const left={}, right={};
    let lastWords = [];
    results.forEach(data=>{
      const lists = (data._variantWords && data._variantWords.length) ? data._variantWords : [flattenWords(data)];
      const words = mergeWords(lists);
      lastWords = words;
      const parsed = parseSummaryScreen(words);
      if(parsed){ Object.assign(left, parsed.left); Object.assign(right, parsed.right); }
      // Fallback: the old "[num] label [num]" heuristic (works on other screen variants)
      if(!Object.keys(left).length && !Object.keys(right).length){
        clusterRows(words).forEach(row=>{
          const p = parseTeamStatRow(row.words);
          if(p){ left[p.label]=p.for; right[p.label]=p.against; }
        });
      }
    });
    const labels = Array.from(new Set([...Object.keys(left), ...Object.keys(right)]));
    if(!labels.length){
      const totalWords = results.reduce((s,d)=> s + (d._procWords||flattenWords(d).length), 0);
      const thumb = (blob, label)=>{
        if(!blob || typeof URL.createObjectURL !== 'function') return '';
        return `<div><div class="sub" style="margin-bottom:4px">${label}</div><img src="${URL.createObjectURL(blob)}" style="max-width:150px; max-height:200px; border-radius:8px; border:1px solid var(--line); display:block"></div>`;
      };
      const previews = results.map((d,i)=>{
        const a = thumb(d._src, `Image ${i+1}: as OCR saw it`);
        const b = (d._orig && d._src !== d._orig) ? thumb(d._orig, `Image ${i+1}: original file`) : '';
        return (a||b) ? `<div style="margin-top:10px; display:flex; gap:14px; align-items:flex-start">${a}${b}</div>` : '';
      }).join('');
      const sample = lastWords.slice(0, 40).map(w=>esc(w.text)).join(' · ');
      prog.innerHTML = `<div class="hint" style="color:var(--red)">No stat rows recognized (OCR read ${totalWords} word(s)) [build ${SCAN_BUILD}] — check image clarity or enter manually. If it keeps failing, send us this screen (preview + word sample) and we'll see exactly what the scanner received.</div>${sample ? `<div class="hint" style="margin-top:8px; font-size:12px">Words OCR read (first 40): ${sample}</div>` : ''}${previews}`;
      return;
    }
    // Home team is always the LEFT column in the game → map to us/them via Home/Away.
    const usSide = homeAway==='away' ? 'right' : 'left';
    let filled = 0;
    labels.forEach(rawLabel=>{
      const label = canonicalStatLabel(rawLabel);
      const us = usSide==='left' ? left[rawLabel] : right[rawLabel];
      const them = usSide==='left' ? right[rawLabel] : left[rawLabel];
      let row = document.querySelector(`#teamstat-rows .statline[data-label="${CSS.escape(label)}"]`);
      if(!row){
        document.getElementById('teamstat-custom').insertAdjacentHTML('beforeend', teamStatLine(label));
        const all = document.querySelectorAll(`#teamstat-custom .statline[data-label="${CSS.escape(label)}"]`);
        row = all[all.length-1];
      }
      if(us!=null && us!==''){ row.querySelector('[data-side=for]').value = us; filled++; }
      if(them!=null && them!==''){ row.querySelector('[data-side=against]').value = them; }
    });
    toast(`Filled ${filled} team stat(s) — us = ${usSide} column (you're ${homeAway})`);
    prog.innerHTML = `<div class="hint" style="color:var(--turf)">Scan complete — ${filled} stat(s) filled in. Review the numbers, then save.</div>`;
  }catch(err){
    const timedOut = /timed out/.test(err.message||'');
    prog.innerHTML = `<div class="hint" style="color:var(--red)">${timedOut ? "This is taking too long — check your connection." : `Couldn't read that image automatically (${esc(err.message||'scan failed')}) [build ${SCAN_BUILD}].`} Just type the values in below for now.</div>`;
  }
}

function wireScan(inputId, boxId, progId, scanFn){
  const input = document.getElementById(inputId);
  const box = document.getElementById(boxId);
  if(!input || !box) return;
  const run = async (files)=>{
    if(!files.length) return;
    box.classList.add('active');
    try{ await scanFn(files, progId); } finally { box.classList.remove('active'); }
  };
  input.addEventListener('change', async (e)=>{ const files = Array.from(e.target.files||[]); await run(files); e.target.value=''; });
  box.addEventListener('click', (e)=>{ if(e.target.tagName!=='INPUT') box.focus(); });
  box.addEventListener('paste', async (e)=>{
    const items = Array.from(e.clipboardData?.items || []);
    const files = items.filter(it=>it.type && it.type.startsWith('image/')).map(it=>it.getAsFile()).filter(Boolean);
    if(!files.length) return;
    e.preventDefault();
    await run(files);
  });
}

/* OCR gives all-caps names ("CLUB BRUGGE"); tidy to "Club Brugge" but keep short acronyms (FC, PSG). */
function titleTeam(s){
  return (s||'').split(/\s+/).filter(Boolean).map(w=>{
    if(w === w.toUpperCase() && /^[A-Z0-9.\-]+$/.test(w) && w.length <= 4) return w;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}

/* Pure parser: from OCR'd words + positions on the PLAYERS screen, work out
   opponent team, home/away and the opponent's two gamertags.
   Layout (fixed-ratio game UI): "PLAYERS" title top-centre; two team names below it (left/right);
   a small "Player" heading under each team; then each side's gamertags, with a tiny
   console/PC icon to the left of each. */
function parsePlayersScreen(words, W, H){
  const fail = (reason, extra)=> Object.assign({ok:false, reason}, extra||{});
  if(!words || words.length < 6 || !W || !H) return fail('too-few-words', {read:(words||[]).slice(0,25).map(w=>w.text)});
  const mid = W/2;
  const isLetter = c => (c>='a'&&c<='z') || (c>='A'&&c<='Z');
  const texty = w=>{
    const s = w.text||'';
    if(s.length < 2) return false;
    let letters = 0;
    for(let i=0;i<s.length;i++) if(isLetter(s[i])) letters++;
    // letters>=2 so short real parts like "FC" survive; glyph noise (1–3 symbols) still drops out
    return letters >= 2 && letters/s.length >= 0.5;
  };

  /* 1) "PLAYERS" title — top of the screen (anchors the band below it) */
  const title = words.find(w=> w.t==='players' && w.cy < H*0.2) || null;
  const titleBottom = title ? title.bbox.y1 : 0;

  /* 2) "Player" heading(s) — mid screen, one per side */
  const isHeading = w=>{
    const c = (w.t||'').replace(/[^a-z]/g,'');
    const match = HEADING_WORDS.has(c) || (c.indexOf('play')===0 && c.length>=4 && c.length<=8);
    return match && w.cy > H*0.28 && w.cy < H*0.55;
  };
  const headings = words.filter(isHeading);
  let headingTop, headingBottom;
  if(headings.length){
    headingTop = Math.min.apply(null, headings.map(h=> h.bbox.y0));
    headingBottom = Math.max.apply(null, headings.map(h=> h.bbox.y1));
  } else {
    headingTop = H*0.40; headingBottom = H*0.47; // fallback: the screen is fixed-ratio
  }

  /* 3) team names: clean words between the title and the headings; on each side the name
     starts to the right of that side's "Player" heading (crests live further out) */
  const headL = headings.filter(h=> h.cx < mid);
  const headR = headings.filter(h=> h.cx >= mid);
  function sideTeam(side){
    const isL = side==='L';
    const heads = isL ? headL : headR;
    const xEdge = heads.length ? Math.max.apply(null, heads.map(h=> h.bbox.x1)) : null;
    const cands = words.filter(w=>
      w.cy > titleBottom + H*0.02 && w.cy < headingTop &&
      w.cx > W*0.06 && w.cx < W*0.89 &&
      ((isL && w.cx < mid) || (!isL && w.cx >= mid)) &&
      (xEdge == null || w.bbox.x0 > xEdge) &&
      texty(w));
    if(!cands.length) return '';
    const rows = [];
    for(const w of cands.slice().sort((a,b)=> a.cy-b.cy || a.bbox.x0-b.bbox.x0)){
      const r = rows[rows.length-1];
      if(r && (w.cy - r.cy0) <= 0.5 * Math.max(r.maxh, w.h)){ r.words.push(w); r.maxh = Math.max(r.maxh, w.h); }
      else rows.push({words:[w], cy0:w.cy, maxh:w.h});
    }
    const kept = [];
    for(const r of rows){
      const hs = r.words.map(x=> x.h).sort((a,b)=> a-b);
      const med = hs[Math.floor(hs.length/2)];
      for(const w of r.words) if(w.h >= med*0.6 && w.h <= med*1.6) kept.push(w);
    }
    if(!kept.length) return '';
    kept.sort((a,b)=> a.cy-b.cy || a.bbox.x0-b.bbox.x0);
    return kept.map(w=> w.text).join(' ');
  }
  const teamLeft = sideTeam('L'), teamRight = sideTeam('R');

  /* 4) gamertags: tag-shaped words just below the heading row (icons/badges are 1–3 symbols) */
  const headingH = Math.min(60, Math.max(20, headingBottom - headingTop)); // cap: the no-heading fallback band is ~78px and would over-filter tag height
  function pickTags(minLen){
    return words.filter(w=>{
      if(w.bbox.y0 < headingBottom - 4 || w.cy >= headingBottom + H*0.20) return false;
      const s = w.text||'';
      if(s.length < minLen || w.h < headingH*0.45) return false;
      let alnum = 0;
      for(let i=0;i<s.length;i++){ const c=s[i]; if(isLetter(c)||(c>='0'&&c<='9')||c==='_') alnum++; }
      return alnum >= Math.min(4, s.length) && alnum/s.length >= 0.5;
    });
  }
  let tags = pickTags(4);
  if(!tags.length) tags = pickTags(3); // short gamertags — try again, more relaxed
  const sideL = tags.filter(w=> w.cx < mid).sort((a,b)=> a.bbox.y0-b.bbox.y0 || a.bbox.x0-b.bbox.x0);
  const sideR = tags.filter(w=> w.cx >= mid).sort((a,b)=> a.bbox.y0-b.bbox.y0 || a.bbox.x0-b.bbox.x0);
  const oursInL = sideL.filter(w=> OUR_TAG_SET.has(normTag(w.text))).length;
  const oursInR = sideR.filter(w=> OUR_TAG_SET.has(normTag(w.text))).length;
  if(!oursInL && !oursInR) return fail('no-our-tag', {read: sideL.concat(sideR).map(w=> w.text)});
  let ourSide;
  if(oursInL > oursInR) ourSide = 'L';
  else if(oursInR > oursInL) ourSide = 'R';
  else ourSide = sideL.length >= sideR.length ? 'L' : 'R';
  const opp = ourSide==='L' ? sideR : sideL;
  const oppTeam = ourSide==='L' ? teamRight : teamLeft;
  const oppTop2 = opp.slice(0,2);
  return {
    ok: true,
    homeAway: ourSide==='L' ? 'home' : 'away',
    opponentTeam: oppTeam || '',
    opponentGamertags: oppTop2.map(w=> w.text),
    oppTagBboxes: oppTop2.map(w=> ({text: w.text, bbox: w.bbox})),
    ourSide
  };
}

let iconTplCache = null;
function iconTplNorm(b64){
  return new Promise(res=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        try{
          const N = 48, cv = document.createElement('canvas'); cv.width=N; cv.height=N;
          const ctx = cv.getContext('2d');
          ctx.drawImage(img, 0, 0, N, N);
          const d = ctx.getImageData(0,0,N,N).data;
          const g = new Float32Array(N*N);
          let m = 0;
          for(let i=0;i<N*N;i++){ const v=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/10; g[i]=v; m+=v; }
          m /= (N*N);
          let sd = 0;
          for(let i=0;i<N*N;i++){ const dl=g[i]-m; sd += dl*dl; }
          sd = Math.sqrt(sd/(N*N)) || 1;
          for(let i=0;i<N*N;i++) g[i] = (g[i]-m)/sd;
          res(g);
        }catch(e){ res(null); }
      };
      img.onerror = ()=> res(null);
      img.src = 'data:image/png;base64,' + b64;
    }catch(e){ res(null); }
  });
}
function iconTplReady(){
  if(iconTplCache) return Promise.resolve(iconTplCache);
  return Promise.all([iconTplNorm(ICON_TPL_B64.console), iconTplNorm(ICON_TPL_B64.pc)])
    .then(([consoleTpl, pcTpl])=>{ iconTplCache = {console: consoleTpl, pc: pcTpl}; return iconTplCache; });
}
async function guessPlatformIcons(file, ocrW, tagBboxes){
  const out = ['',''];
  try{
    const t = await iconTplReady();
    if(!t.console || !t.pc || !file) return out;
    const bmp = await createImageBitmap(file);
    const s = (ocrW && bmp.width) ? ocrW/bmp.width : 1;
    for(let i=0;i<Math.min(2, tagBboxes.length);i++){
      const b = tagBboxes[i] && tagBboxes[i].bbox;
      if(!b) continue;
      const h = Math.max(8, b.y1-b.y0), cy = (b.y0+b.y1)/2;
      let x0 = Math.max(0,(b.x0 - 1.8*h)/s), x1 = Math.min(bmp.width,(b.x0 - 0.25*h)/s);
      let y0 = Math.max(0,(cy - 0.8*h)/s), y1 = Math.min(bmp.height,(cy + 0.8*h)/s);
      if(x1-x0 < 12 || y1-y0 < 12) continue;
      const N = 48, cv = document.createElement('canvas'); cv.width=N; cv.height=N;
      const ctx = cv.getContext('2d');
      ctx.drawImage(bmp, x0, y0, x1-x0, y1-y0, 0, 0, N, N);
      const d = ctx.getImageData(0,0,N,N).data;
      const g = new Float32Array(N*N);
      let m = 0;
      for(let i2=0;i2<N*N;i2++){ const v=(d[i2*4]*299+d[i2*4+1]*587+d[i2*4+2]*114)/10; g[i2]=v; m+=v; }
      m /= (N*N);
      let sd = 0;
      for(let i2=0;i2<N*N;i2++){ const dl=g[i2]-m; sd += dl*dl; }
      sd = Math.sqrt(sd/(N*N)) || 1;
      for(let i2=0;i2<N*N;i2++) g[i2] = (g[i2]-m)/sd;
      let sC = 0, sP = 0, nC = 0, nP = 0;
      for(let i2=0;i2<N*N;i2++){ sC += g[i2]*t.console[i2]; sP += g[i2]*t.pc[i2]; nC += t.console[i2]*t.console[i2]; nP += t.pc[i2]*t.pc[i2]; }
      const cScore = sC/Math.sqrt(nC) || 0; // templates are normalized; this is the NCC
      const pScore = sP/Math.sqrt(nP) || 0;
      const best = cScore > pScore ? ['console', cScore] : ['pc', pScore];
      if(best[1] > 0.45 && Math.abs(cScore - pScore) > 0.15) out[i] = best[0];
    }
  }catch(e){ /* icon guessing is a bonus — never let it block the main fill */ }
  return out;
}

/* Read the PLAYERS screen and fill the Log Match draft. */
async function scanPlayersScreen(files, progId){
  const line = html => { const p = document.getElementById(progId); if(p) p.innerHTML = html; };
  try{
    const results = await ocrReadFiles(files.slice(0,1), progId, [{}]);
    const data = results[0];
    const words = mergeWords((data && data._variantWords) || [flattenWords(data)]);
    const res = parsePlayersScreen(words, data.width||0, data.height||0);
    if(!res.ok){
      const read = (res.read || words.slice(0,25).map(w=> w.text)).join(', ');
      const msg = res.reason==='no-our-tag'
        ? `Couldn't find your gamertag (${OUR_TAGS.join(' / ')}) on that screen, so I don't know which side is yours. What I could read: ${esc(read)||'—'}. Fill the boxes by hand for now.`
        : `Couldn't read that PLAYERS screen automatically. What I could read: ${esc(read)||'nothing'}. Fill the boxes by hand for now.`;
      line('<div class="hint" style="color:var(--red)">' + msg + '</div>');
      return;
    }
    readDraftFromForm();
    logDraft.homeAway = res.homeAway;
    if(res.opponentTeam) logDraft.opponentTeam = titleTeam(res.opponentTeam);
    logDraft.opponentGamertags = [res.opponentGamertags[0]||'', res.opponentGamertags[1]||''];
    logDraft.opponentPlatforms = await guessPlatformIcons(files[0], data.width||0, res.oppTagBboxes||[]);
    logDraft.opponentCountries = ['',''];
    render();
    const n = res.opponentGamertags.length;
    line('<div class="hint" style="color:var(--turf)">✓ Scanned — <b>' + esc(titleTeam(res.opponentTeam)||'opponent team') +
         '</b> · ' + (res.homeAway==='home' ? 'Home' : 'Away') +
         (n ? ' · ' + n + ' gamertag' + (n===1?'':'s') + ' filled in below' : '') + '</div>');
    toast('PLAYERS screen read — review the boxes below');
  }catch(err){
    line('<div class="hint" style="color:var(--red)">Couldn\'t read that image (' +
         esc((err && err.message) || 'scan failed') + ') [build ' + SCAN_BUILD +
         ']. Just fill the boxes by hand for now.</div>');
  }
}

/* A season can span several teams (mid-season switch) — each gets its own squad block.
   Legacy seasons without a team keep the old single season-squad block. */
function seasonSquadBlocks(s){
  const tlist = seasonTeams(s);
  const blocks = (tlist.length ? tlist : [null]);
  return blocks.map(t=>{
    const ids = t ? (t.playerIds||[]) : (s.squadIds||[]);
    const key = t ? t.id : 'none';
    const label = t ? t.name : 'squad';
    return `
    <div class="section-title" style="margin:16px 0 8px">Squad — ${esc(label)} <span class="subtle">(${ids.length})${t ? ' · team sheet, shared with Settings' : ''}</span></div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px">
      ${ids.map(pid=>`<span class="tag" style="display:flex;align-items:center;gap:6px;padding:5px 10px">${esc(playerName(pid))} <button data-rm-squad="${s.id}|${key}|${pid}" style="background:none;border:none;color:var(--red);font-size:13px">×</button></span>`).join('') || `<span class="subtle">Empty — add players below</span>`}
    </div>
    <div class="row" style="align-items:flex-end">
      <div class="field" style="margin-bottom:0"><label>Add to ${esc(label)}</label>
        <select data-squad-add="${s.id}|${key}"><option value="">Choose player…</option>${freePlayers().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        ${!freePlayers().length ? `<div class="hint">Every player is already on a team sheet — a player can only count for one team.</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function wireSquadHandlers(){
  document.getElementById('add-player-btn')?.addEventListener('click', async ()=>{

  document.querySelectorAll('[data-perfect]').forEach(cb=> cb.addEventListener('change', ()=>{

  document.querySelectorAll('[data-rm-squad]').forEach(b=> b.addEventListener('click', ()=>{

    const t = key && key!=='none' ? teamById(key) : null;
    if(t){ dbSet('teams', t.id, {...stripId(t), playerIds:(t.playerIds||[]).filter(x=>x!==pid)}); }
    else { dbSet('seasons', sid, {...stripId(s), squadIds:(s.squadIds||[]).filter(x=>x!==pid)}); }
  }));
  document.querySelectorAll('[data-squad-add]').forEach(sel=> sel.addEventListener('change', ()=>{
    const [sid,key] = sel.dataset.squadAdd.split('|'); const pid = sel.value; if(!pid) return;
    const s = seasonById(sid); if(!s) return;
    const t = key && key!=='none' ? teamById(key) : null;
    if(t){ dbSet('teams', t.id, {...stripId(t), playerIds:[...(t.playerIds||[]), pid]}); }
    else { dbSet('seasons', sid, {...stripId(s), squadIds:[...(s.squadIds||[]), pid]}); }
  }));
}
function stripId(obj){ const {id, ...rest} = obj; return rest; }

function openNewSeasonModal(){
  const nextNum = seasons.length ? Math.max(...seasons.map(s=>s.number||0))+1 : 1;
  const prev = seasons[0] || null;
  const prevTeams = seasonTeams(prev);                       // may be several (mid-season switch)
  const lastTeamObj = prevTeams.length ? prevTeams[prevTeams.length-1] : null;  // most recent team
  const lastTeam = lastTeamObj ? lastTeamObj.name : (prev?.team || '');
  const lastTeamId = lastTeamObj && lastTeamObj.id ? lastTeamObj.id : (prev?.teamId || '');
  const html = `<div class="modal-bg" id="modal"><div class="modal">
    <div class="modal-head"><h3>New season</h3><button class="xbtn" id="modal-close">×</button></div>
    <div class="row">
      <div class="field"><label>Season number</label><input type="number" id="ns-num" value="${nextNum}"></div>
      <div class="field"><label>Game version</label><input type="text" id="ns-ver" placeholder="FC26" value="${seasons[0]?.gameVersion||'FC26'}"></div>
    </div>
    <div class="field"><label>Team</label>
      ${teams.length ? `<select id="ns-team">${teams.map(t=>`<option value="${t.id}" ${t.id===lastTeamId?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`
      : `<input type="text" id="ns-team" placeholder="Real Madrid" value="${esc(lastTeam)}">`}
    </div>
    <div class="field"><label>Carry squad over from last season?</label>
      <select id="ns-carry"><option value="1">Yes — copy ${esc(lastTeam)?lastTeam+' ':''}squad from #${seasons[0]?.number||'-'}</option><option value="0">No — start empty</option></select>
    </div>
    <button class="btn" id="ns-save" style="width:100%; justify-content:center; margin-top:6px">Create season</button>
  </div></div>`;
  document.getElementById('modal-root').innerHTML = html;
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
  document.getElementById('ns-save').addEventListener('click', async ()=>{
    const number = Number(document.getElementById('ns-num').value||1);
    const gameVersion = document.getElementById('ns-ver').value.trim();
    const teamEl = document.getElementById('ns-team');
    let teamId = '', teamName = '';
    if(teamEl.tagName==='SELECT'){
      teamId = teamEl.value; teamName = (teamById(teamId)||{}).name || lastTeam;
    } else {
      teamName = teamEl.value.trim();
      if(!teamName){ toast('Enter a team name'); return; }
      const existing = teams.find(t=>t.name.toLowerCase()===teamName.toLowerCase());
      teamId = existing ? existing.id : await dbAdd('teams', {name:teamName, playerIds:[]});
    }
    const carry = document.getElementById('ns-carry').value==='1';
    const prevTeams = seasons[0] ? seasonTeams(seasons[0]) : [];
    const carryTeam = prevTeams.length ? prevTeams[prevTeams.length-1] : null;  // carry the most recent team's sheet
    const squadIds = carry && seasons[0] ? [...(carryTeam ? (carryTeam.playerIds||[]) : (seasons[0].squadIds||[]))] : [];
    await dbAdd('seasons', {number, gameVersion, team: teamName, teamId, squadIds, champion:false, perfectSeason:false, createdAt:Date.now()});
    closeModal();
    toast('Season created');
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ============================= SETTINGS (TEAMS) ============================= */
/* One-time migration: create a team sheet from the seasons that already exist, so
   nothing is lost when the Teams feature lands. */
async function maybeSeedTeams(){
  if(seedingTeams || localStorage.getItem('teamsSeeded')) return;
  if(teams.length && seasons.length) return;          // already have teams
  if(!seasons.length) return;                          // wait for seasons to load
  seedingTeams = true;
  try{
    const byName = {};
    seasons.forEach(s=>{
      if(s.teamId) return;
      const k = (s.team||'').trim(); if(!k) return;
      byName[k] = byName[k] || new Set();
      (s.squadIds||[]).forEach(pid=>byName[k].add(pid));
    });
    for(const [name, ids] of Object.entries(byName)){
      try{
        const tid = await dbAdd('teams', {name, playerIds:[...ids]});
        for(const s of seasons.filter(s=>!s.teamId && (s.team||'').trim()===name)){
          await dbSet('seasons', s.id, {...stripId(s), teamId: tid});
        }
      }catch(e){ console.warn('Team auto-setup skipped a step:', e); }
    }
    localStorage.setItem('teamsSeeded','1');
  }finally{ seedingTeams = false; }
}

  <div class="pagehead"><div><h1>Settings</h1><div class="sub">Teams, sheets and app preferences</div></div></div>

  <div class="section-title">Team Sheets <span class="subtle">— each team has its own player sheet; the scanner matches names against the sheet of the team you pick</span></div>

    </div>
    <div class="hint">The player pool is shared, but a player can only count for ONE team — each team's sheet decides who belongs to it. Teams you add show up in the Season dropdown when you create a season.</div>
  </div>

    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap">
      <div class="num" style="font-size:19px">${esc(t.name)} <span class="subtle">(${(t.playerIds||[]).length} players)</span></div>
      <div style="display:flex; gap:8px; align-items:center">
        <button class="link-btn" data-rename-team="${t.id}">✎ Rename team</button>
        <button class="link-btn" data-del-team="${t.id}" style="color:var(--red)">Delete</button>

    </div>
    <div class="section-title" style="margin:14px 0 8px">Sheet</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px">
      ${(t.playerIds||[]).map(pid=>`<span class="tag" style="display:flex;align-items:center;gap:6px;padding:5px 10px">${esc(playerName(pid))} <button data-rename-player="${pid}" title="Rename this player everywhere" style="background:none;border:none;color:var(--gold);font-size:12px;line-height:1;padding:0 2px">✎</button> <button data-rm-team="${t.id}|${pid}" style="background:none;border:none;color:var(--red);font-size:13px">×</button></span>`).join('') || `<span class="subtle">Empty — add players below</span>`}
    </div>
    ${missing.length ? `<div class="row" style="align-items:flex-end">
      <div class="field" style="margin-bottom:0"><label>Add to ${esc(t.name)}</label>
        <select data-team-add="${t.id}"><option value="">Choose player…</option>${missing.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
      </div>
    </div>` : `<div class="hint">Every player is already on a team sheet — a player can only count for one team. Add a new player in Squad &amp; Seasons to assign them here.</div>`}
  </div>`;
}

/* ============================= HISTORY ============================= */
let historyFilterSeason = '';
function renderHistory(){
  const filtered = games.filter(g=> !historyFilterSeason || g.seasonId===historyFilterSeason);
  return `
  <div class="pagehead"><div><h1>Match History</h1><div class="sub">${games.length} matches logged</div></div>
    <select id="history-filter">
      <option value="">All seasons</option>
      ${seasons.map(s=>`<option value="${s.id}" ${historyFilterSeason===s.id?'selected':''}>#${s.number} · ${esc(seasonTeamName(s))}</option>`).join('')}
    </select>
  </div>
  ${filtered.length ? filtered.map(g=>historyRow(g)).join('') : `<div class="card empty">No matches ${historyFilterSeason?'in this season':'logged'} yet.</div>`}
  `;
}

function historyRow(g){
  const s = seasonById(g.seasonId);
  const o = outcome(g);
  const scorers = (g.playerStats||[]).filter(p=>p.goals>0).map(p=>`${playerName(p.playerId)} ${p.goals>1?'×'+p.goals:''}`).join(', ');
  const assisters = (g.playerStats||[]).filter(p=>p.assists>0).map(p=>`${playerName(p.playerId)} ${p.assists>1?'×'+p.assists:''}`).join(', ');
  const stats = g.teamStats || {for:{}, against:{}};
  const statRows = Object.keys(stats.for||{}).length ? Object.entries(stats.for).map(([label,fv])=>{
    const av = stats.against?.[label];
    const fn = parseFloat(fv)||0, an = parseFloat(av)||0; const tot = fn+an || 1;
    return `<div class="vs-bar"><div class="val">${esc(fv)}</div><div class="track"><div class="fill-a" style="width:${fn/tot*100}%"></div><div class="fill-b" style="width:${an/tot*100}%"></div></div><div class="val right">${esc(av||'')}</div></div><div class="vs-label">${esc(label)}</div>`;
  }).join('') : '';
  return `<div class="card" style="margin-bottom:12px" data-game="${g.id}">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px">
      <div>
        <span class="pill ${o}">${o.toUpperCase()}</span>
        <span style="margin-left:8px; font-weight:600">vs ${esc(g.opponentTeam||'—')}</span>
        <span class="subtle"> · ${g.homeAway==='home'?'Home':'Away'} · #${s?s.number:'?'} game ${g.gameNumber||''}</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px">
        <div class="num" style="font-size:22px">${g.scoreFor} – ${g.scoreAgainst}</div>
        <button class="link-btn" data-edit-game="${g.id}">Edit</button>
        <button class="link-btn" data-del-game="${g.id}" style="color:var(--red)">Delete</button>
      </div>
    </div>
    ${g.rageQuit==='them' ? `<div class="tag" style="margin-top:8px;color:var(--red);border-color:var(--red)">They rage quit</div>` : ''}
    ${g.disconnect ? `<div class="tag" style="margin-top:8px">Disconnect</div>` : ''}
    ${scorers ? `<div class="subtle" style="margin-top:8px">⚽ ${esc(scorers)}</div>` : ''}
    ${assisters ? `<div class="subtle" style="margin-top:2px">🅰️ ${esc(assisters)}</div>` : ''}
    ${g.motmPlayerId ? `<div class="subtle" style="margin-top:2px">⭐ MOTM: ${esc(playerName(g.motmPlayerId))}</div>` : ''}
    ${statRows ? `<div class="section-title" style="margin:14px 0 6px">Team stats</div>${statRows}` : ''}
  </div>`;
}

function wireHistoryHandlers(){
  document.getElementById('history-filter')?.addEventListener('change', e=>{ historyFilterSeason = e.target.value; render(); });
  document.querySelectorAll('[data-del-game]').forEach(b=> b.addEventListener('click', ()=>{
    if(confirm('Delete this match permanently?')) dbDelete('games', b.dataset.delGame);

}

/* ============================= AUTH ============================= */
/* No email list here on purpose — real enforcement lives in your private
   Firestore rule (Firebase Console → Firestore → Rules), which isn't part
   of this public repo. If Firestore rejects a signed-in account, we just
   show a generic message and sign them out below. */
let currentUser = null;
let dbStarted = false;
let accessDeniedShown = false;

function initAuth(){
  firebase.auth().onAuthStateChanged(user=>{
    currentUser = user;
    document.getElementById('login-screen').style.display = user ? 'none' : 'flex';
    document.getElementById('app').style.display = user ? 'flex' : 'none';
    if(user && !dbStarted){ dbStarted = true; accessDeniedShown = false; initDb(); }
    if(!user){ dbStarted = false; }
  });
}

document.getElementById('google-signin-btn').addEventListener('click', async ()=>{
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('google-signin-btn');
  errEl.textContent = '';
  btn.disabled = true;
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await firebase.auth().signInWithPopup(provider);
  }catch(err){
    errEl.textContent = err.code==='auth/popup-closed-by-user' ? '' :
      err.code==='auth/unauthorized-domain' ? "This site isn't authorized in Firebase yet — add its domain under Authentication → Settings → Authorized domains." :
      (err.message || 'Sign-in failed.');
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('signout-btn').addEventListener('click', ()=> firebase.auth().signOut());

function initSnowfall(){
  const root = document.getElementById('zc-snow');
  if(!root) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const frag = document.createDocumentFragment();
  for(let i=0;i<70;i++){
    const d = document.createElement('div');
    d.className = 'flake';
    const size = 2 + Math.random()*4;
    d.style.left = (Math.random()*100)+'%';
    d.style.width = size+'px';
    d.style.height = size+'px';
    d.style.opacity = (0.5 + Math.random()*0.5).toFixed(2);
    const dur = 8 + Math.random()*10;
    d.style.animationDuration = dur+'s';
    d.style.animationDelay = (-Math.random()*dur)+'s';
    frag.appendChild(d);
  }
  root.appendChild(frag);
}

initAuth();
initSnowfall();
render();
</script>
